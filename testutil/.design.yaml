package: testutil
purpose: In-process OAuth authorization server plus standalone OAuth/JWT helpers for oneauth integration tests.
language: go
last_rebuilt: 57e6f0d2b10e75e7c3d4a352bd0a229beb99900e
last_rebuilt_at: 2026-05-24T17:31:10Z
entities:
  - name: TestAuthServer
    kind: struct
    role: In-process httptest-backed OAuth AS with RSA keys, JWKS, token, introspection, AS metadata, and app registration endpoints.
    why: Centerpiece of the package; gives downstream test suites a real oneauth stack on a random port.
  - name: NewTestAuthServer
    kind: func
    role: Builds a TestAuthServer bound to *testing.T with automatic t.Cleanup shutdown.
    why: Preferred entry point for tests; removes the need for manual Close calls.
  - name: NewAuthServer
    kind: func
    role: Builds a TestAuthServer without *testing.T; caller must Close.
    why: Lets examples, benchmarks, and non-test code reuse the same server.
  - name: Option
    kind: type
    role: Functional option type for configuring a TestAuthServer.
    why: Keeps NewAuthServer's signature stable as new knobs are added.
  - name: WithAdminKey
    kind: func
    role: Sets the admin API key guarding /apps endpoints.
    why: Overrides the default "testutil-admin-key" when a test asserts a specific key.
  - name: WithIssuer
    kind: func
    role: Sets the JWT issuer and AS-metadata issuer.
    why: Default sentinel is replaced with the live server URL after start; override pins a value.
  - name: WithAudience
    kind: func
    role: Sets the JWT audience claim on minted tokens.
    why: Empty default leaves tokens unrestricted; tests asserting audience must opt in.
  - name: WithScopes
    kind: func
    role: Sets scopes_supported in AS metadata (advertisement only).
    why: Lets tests advertise custom scopes without changing server behavior.
  - name: WithClaimsSupported
    kind: func
    role: Sets claims_supported in AS metadata.
    why: Default lists the claims oneauth tokens actually emit; override only when asserting other claims.
  - name: WithGrantTypesSupported
    kind: func
    role: Replaces the advertised grant_types_supported list.
    why: Advertising a grant does NOT enable its handler; pair with WithTrustedAssertionIssuers to actually serve it.
  - name: WithIssParameterSupported
    kind: func
    role: Sets the RFC 9207 iss-parameter flag in AS metadata.
    why: Metadata-only; no authorization endpoint drives the actual behavior yet.
  - name: WithTrustedAssertionIssuers
    kind: func
    role: Enables jwt-bearer (RFC 7523) and token-exchange (RFC 8693) grants and auto-extends advertised grants.
    why: Only Option that turns advertisement into real behavior; later WithGrantTypesSupported can still override.
  - name: TestAuthServer.MintToken
    kind: method
    role: Mints a standard RS256 access JWT directly, bypassing the HTTP token endpoint.
    why: Fast path with no network round-trip; kid header matches JWKS for verification.
  - name: TestAuthServer.MintTokenWithClaims
    kind: method
    role: Mints an RS256 JWT from an arbitrary claims map with overridable iss/iat/exp defaults.
    why: Enables negative tests (wrong issuer, expired, missing claims).
  - name: TestAuthServer.MintTokenForSubject
    kind: method
    role: Convenience minting for a subject and scopes; no *testing.T needed.
    why: Aimed at non-test example code that still wants a signed token.
  - name: TestAuthServer.URL
    kind: method
    role: Returns the server base URL.
    why: Only known after the random httptest port binds.
  - name: TestAuthServer.JWKSURL
    kind: method
    role: Returns the JWKS endpoint URL.
    why: Lets tests point JWKS-aware clients at the live server.
  - name: TestAuthServer.TokenEndpoint
    kind: method
    role: Returns the token endpoint URL.
    why: Lets tests POST grants directly when bypassing discovery.
  - name: TestAuthServer.AdminKey
    kind: method
    role: Returns the configured admin API key.
    why: Tests need it to call /apps endpoints.
  - name: TestAuthServer.Issuer
    kind: method
    role: Returns the resolved JWT issuer.
    why: Reads the server URL when the default sentinel was used.
  - name: TestAuthServer.Close
    kind: method
    role: Stops the underlying httptest server; nil-safe.
    why: Called automatically via t.Cleanup when NewTestAuthServer is used.
  - name: OIDCConfig
    kind: struct
    role: Parsed OAuth/OIDC AS metadata document (RFC 8414).
    why: Decode target for DiscoverOIDC and a typed view onto the discovery doc.
  - name: TokenResponse
    kind: struct
    role: Parsed OAuth token endpoint response (RFC 6749 §5.1).
    why: Common return type for the grant helpers.
  - name: DiscoverOIDC
    kind: func
    role: Fetches and parses the .well-known/openid-configuration document.
    why: Works against any compliant AS; fails via t.Fatal for test ergonomics.
  - name: GetClientCredentialsToken
    kind: func
    role: Acquires a token via the client_credentials grant (RFC 6749 §4.4).
    why: Thin wrapper that delegates to PostTokenEndpoint with the right form fields.
  - name: GetPasswordToken
    kind: func
    role: Acquires a token via the resource owner password grant (RFC 6749 §4.3).
    why: Test-only helper with no production equivalent.
  - name: PostTokenEndpoint
    kind: func
    role: Sends a form POST to a token endpoint and decodes the JSON TokenResponse.
    why: Shared core that the grant helpers delegate to; reusable for custom grants.
  - name: FetchJWKS
    kind: func
    role: Fetches raw JWKS JSON as an untyped map (RFC 7517).
    why: Lets tests inspect the JWKS without pulling in a JWK library.
  - name: ParseJWTClaims
    kind: func
    role: Base64url-decodes a JWT payload without verifying the signature.
    why: Test introspection only; never use in production.
  - name: ParseJWTHeader
    kind: func
    role: Base64url-decodes a JWT header without verifying the signature.
    why: Test introspection only; never use in production.
