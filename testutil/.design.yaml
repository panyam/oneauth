package: testutil
purpose: Reusable in-process authorization server and standalone OAuth/JWT test helpers for oneauth and downstream integration tests.
language: go
doc_file: doc.go
last_rebuilt: ead2b4a0eb7a36818650e3d4dfa6968277d8a5ac
last_rebuilt_at: 2026-05-22T18:29:59Z
entities:
  - name: TestAuthServer
    kind: struct
    role: In-process httptest-backed OAuth AS with RSA keys, JWKS, token, introspection, registration, and AS-metadata endpoints.
    why: Lets tests and downstream projects exercise real oneauth handlers without standing up an external IdP.
  - name: NewTestAuthServer
    kind: func
    role: Creates and starts a TestAuthServer wired to *testing.T with auto-cleanup.
    why: Registers t.Cleanup so callers never manage shutdown; preferred entry point for tests.
  - name: NewAuthServer
    kind: func
    role: Creates and starts a TestAuthServer without *testing.T; caller must Close.
    why: Enables use in standalone examples/benchmarks where no test harness exists.
  - name: Option
    kind: type
    role: Functional option type configuring a TestAuthServer.
    why: Keeps NewAuthServer signature stable while allowing optional knobs.
  - name: WithAdminKey
    kind: func
    role: Sets the admin API key guarding the /apps registration endpoints.
    why: Defaults to "testutil-admin-key" so most tests need no override.
  - name: WithIssuer
    kind: func
    role: Sets the JWT issuer claim and AS-metadata issuer.
    why: Sentinel default "testutil-issuer" is replaced with the live server URL after start.
  - name: WithAudience
    kind: func
    role: Sets the JWT audience claim on minted tokens.
    why: Empty default means no audience restriction unless the test opts in.
  - name: WithScopes
    kind: func
    role: Sets scopes_supported in AS metadata.
    why: Advertisement only; does not constrain what tokens can be minted with.
  - name: WithClaimsSupported
    kind: func
    role: Sets claims_supported in AS metadata (OIDC Discovery 1.0 §3).
    why: Defaults to the claim set oneauth bearer tokens actually emit.
  - name: WithGrantTypesSupported
    kind: func
    role: Replaces the advertised grant_types_supported list (RFC 8414).
    why: Advertising a grant does NOT enable its handler; must pair with WithTrustedAssertionIssuers to serve it.
  - name: WithIssParameterSupported
    kind: func
    role: Sets authorization_response_iss_parameter_supported in AS metadata (RFC 9207).
    why: Affects metadata only; no authorization endpoint exists so the iss= behavior is not actually driven.
  - name: WithTrustedAssertionIssuers
    kind: func
    role: Configures trusted upstream IdPs for jwt-bearer (RFC 7523) and token-exchange (RFC 8693) grants.
    why: Non-empty slice auto-extends advertised grants; a later WithGrantTypesSupported still wins (last-option-wins).
  - name: MintToken
    kind: method
    role: Mints a standard RS256 access JWT (sub/iss/type/scopes/iat/exp/jti) bypassing the HTTP token endpoint.
    why: Fast path with no network round-trip; kid header matches the JWKS-published key.
  - name: MintTokenWithClaims
    kind: method
    role: Mints an RS256 JWT from an arbitrary claims map with iss/iat/exp defaults the caller can override.
    why: Enables negative tests (wrong issuer, expired, missing claims) while keeping kid valid.
  - name: MintTokenForSubject
    kind: method
    role: Convenience minting of a token for a subject and scopes via MintTokenWithClaims.
    why: Targets standalone (non-*testing.T) example code paths.
  - name: URL
    kind: method
    role: Returns the server base URL.
    why: httptest assigns a random port at start, so the URL is only known after construction.
  - name: JWKSURL
    kind: method
    role: Returns the JWKS endpoint URL.
    why: Saves callers from hardcoding the well-known path.
  - name: TokenEndpoint
    kind: method
    role: Returns the token endpoint URL.
    why: Saves callers from hardcoding /api/token.
  - name: AdminKey
    kind: method
    role: Returns the configured admin API key.
    why: Tests need it to authenticate against the /apps endpoints.
  - name: Issuer
    kind: method
    role: Returns the resolved JWT issuer.
    why: Reflects the post-start value (server URL) when the default sentinel was used.
  - name: Close
    kind: method
    role: Stops the underlying httptest server.
    why: Nil-safe; called automatically by NewTestAuthServer's cleanup.
  - name: OIDCConfig
    kind: struct
    role: Parsed OAuth/OIDC AS metadata document (RFC 8414).
    why: Decode target for DiscoverOIDC.
  - name: TokenResponse
    kind: struct
    role: Parsed OAuth token endpoint response (RFC 6749 §5.1).
    why: Common return type for the token-fetch helpers.
  - name: DiscoverOIDC
    kind: func
    role: Fetches and parses the .well-known/openid-configuration document.
    why: Calls t.Fatal on error for test ergonomics; works against any compliant AS.
  - name: GetClientCredentialsToken
    kind: func
    role: Acquires a token via the client_credentials grant (RFC 6749 §4.4).
    why: Thin wrapper over PostTokenEndpoint; works against any compliant token endpoint.
  - name: GetPasswordToken
    kind: func
    role: Acquires a token via the resource owner password grant (RFC 6749 §4.3).
    why: Test-only convenience with no production equivalent in client/.
  - name: PostTokenEndpoint
    kind: func
    role: Sends a form POST to a token endpoint and decodes the JSON TokenResponse.
    why: Shared core that the convenience grant helpers delegate to.
  - name: FetchJWKS
    kind: func
    role: Fetches raw JWKS JSON as a map (RFC 7517).
    why: Returns untyped map for flexible assertion in tests.
  - name: ParseJWTClaims
    kind: func
    role: Base64url-decodes a JWT payload without verifying the signature.
    why: Test introspection only; never use in production.
  - name: ParseJWTHeader
    kind: func
    role: Base64url-decodes a JWT header without verifying the signature.
    why: Test introspection only; never use in production.
