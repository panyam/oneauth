package: saml
purpose: Registers SAML 2.0 SSO HTTP routes (login, ACS, logout) on a gorilla/mux router, wrapping crewjam/saml to fit oneauth's redirect-based multi-provider login flow.
language: go
last_rebuilt: 57e6f0d2b10e75e7c3d4a352bd0a229beb99900e
last_rebuilt_at: 2026-05-24T17:31:10Z
entities:
  - name: RegisterSamlAuth
    kind: func
    role: Loads the SP keypair and IdP metadata, builds a samlsp.Middleware, and mounts /saml/login, /saml/acs, /saml/logout, and /saml/ on the supplied router.
    why: Single entry point applications call to wire SAML into their oneauth-style auth router; the custom /saml/login handler exists so SAML is one option on a multi-provider /login page rather than gated by RequireAccount middleware.
  - name: HandleUserFunc
    kind: type
    role: Callback signature invoked after a successful ACS assertion, receiving a synthesized oauth2.Token and the extracted user attributes.
    why: Lets the host application persist the SAML user through the same code path it uses for OAuth providers, by masking the SAML assertion as an oauth2.Token.
  - name: logout
    kind: func
    role: Builds a SAML SLO redirect, deletes the local session, and sends the browser to the IdP logout URL.
    why: Implements /saml/logout so callers can trigger single logout without exposing crewjam internals.
  - name: samlMiddleware
    kind: var
    role: Package-level *samlsp.Middleware shared by the login, ACS, and logout handlers.
    why: The handlers are closures registered on the router but need a common ServiceProvider, Session store, and RequestTracker; keeping it package-scoped avoids threading it through every HandlerFunc.
  - name: SAML_ISSUER
    kind: var
    role: Issuer string passed back to the user callback as the provider name; sourced from the SAML_ISSUER env var.
    why: Identifies which IdP authenticated the user when the host app stores or audits credentials.
  - name: SAML_CALLBACK_URL
    kind: var
    role: Configured callback URL from the SAML_CALLBACK_URL env var.
    why: Held for future use by callers configuring the SP; the active callback comes from the RegisterSamlAuth argument today.
  - name: SAML_LOGIN_URL
    kind: var
    role: IdP SSO endpoint from the SAML_LOGIN_URL env var, used as the destination of MakeAuthenticationRequest.
    why: Tells the SP where to redirect the browser to start SP-initiated SSO.
  - name: SAML_METADATA_URL
    kind: var
    role: IdP metadata URL from the SAML_METADATA_URL env var, fetched once at registration to seed the SP.
    why: Provides the IdP's signing certs and endpoint bindings without requiring them to be checked in.
  - name: SAML_CERT_FILE
    kind: const
    role: Filesystem path to the SP's X.509 certificate (saml_service.cert).
    why: Loaded with the private key to sign AuthnRequests and decrypt assertions; marked TODO for migration to configmap.
  - name: SAML_KEY_FILE
    kind: const
    role: Filesystem path to the SP's RSA private key (saml_service.key).
    why: Paired with SAML_CERT_FILE to form the SP keypair; marked TODO for migration to configmap.
depends_on: []
