package: kidstoretest
purpose: Shared, test-only contract suite that every KidStorage backend (in-memory KidStore, FS, GORM, GAE) runs against its own factory, mirroring keystoretest.
language: go
doc_file: doc.go
last_rebuilt: ead2b4a0eb7a36818650e3d4dfa6968277d8a5ac
last_rebuilt_at: 2026-05-22T18:29:59Z
entities:
  - name: Factory
    kind: type
    role: Function alias producing a fresh keys.KidStorage per test invocation.
    why: Lets one suite drive every backend; each impl supplies its own constructor without the suite knowing the backend.
  - name: RunAll
    kind: func
    role: Entry point running the complete KidStorage contract as named subtests against a factory.
    why: Single call per backend keeps coverage in lock-step across all implementations.
  - name: TestAddAndGetByKid
    kind: func
    role: Asserts Add then GetKeyByKid round-trips key bytes, algorithm, clientID, and kid.
    why: Establishes the baseline write-read contract every backend must honor.
  - name: TestGetByUnknownKid
    kind: func
    role: Asserts an unknown kid returns keys.ErrKidNotFound.
    why: Pins the sentinel error so callers can branch on miss vs failure.
  - name: TestGetKeyByClientIDAlwaysNotFound
    kind: func
    role: Asserts GetKey by clientID always returns keys.ErrKeyNotFound on a kid-indexed store.
    why: A kid store is not clientID-indexed; lookup-by-client is meaningless and must fail uniformly.
  - name: TestOverwriteSameKid
    kind: func
    role: Asserts re-Adding the same kid replaces key, algorithm, and clientID.
    why: Add is upsert-by-kid; backends must not silently keep stale rows.
  - name: TestRemoveIdempotent
    kind: func
    role: Asserts Remove of an absent kid is nil and Remove of a present kid clears it.
    why: KidStorage.Remove is intentionally idempotent, unlike KeyStorage.DeleteKey which errors on miss.
  - name: TestExpiredKidNotReturned
    kind: func
    role: Asserts a kid with a past expiry returns keys.ErrKidNotFound on read.
    why: Reads must filter expired entries even before any sweep runs.
  - name: TestZeroExpiryNeverExpires
    kind: func
    role: Asserts a zero time.Time expiry means the kid is always retrievable.
    why: Zero value is the no-expiry sentinel and must not be treated as expired-at-epoch.
  - name: TestCleanExpired
    kind: func
    role: Asserts CleanExpired sweeps only expired kids and physically frees the slot for re-Add.
    why: Confirms the sweep removes the backing row/file, not just hides it from reads.
  - name: TestAsymmetricKeyRoundTrip
    kind: func
    role: Asserts an RSA public-key PEM stored under a computed kid round-trips with RS256.
    why: Backends must preserve PEM bytes verbatim, not just symmetric secrets.
  - name: TestPersistence
    kind: func
    role: Asserts the store reads back what it wrote within one instance.
    why: Trivial for in-memory but exercises the real storage layer for FS/GORM/GAE; cross-restart proof lives in backend-specific tests.
depends_on:
  - path: ../keys
    entities: [KidStorage, ErrKidNotFound, ErrKeyNotFound]
  - path: ../utils
    entities: [ComputeKid, GenerateRSAKeyPair]
