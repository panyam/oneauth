package: keystoretest
purpose: Shared conformance test suite that every `keys.KeyStorage` backend (inmem, fs, gorm, gae) runs against to prove uniform put/get/delete/list, kid resolution, and asymmetric key round-trip semantics.
language: go
last_rebuilt: 1fdddf397a0df7dcf0037de53891635664d8372f
last_rebuilt_at: 2026-05-27T20:17:38Z
entities:
  - name: Factory
    kind: type
    role: "`func(t *testing.T) keys.KeyStorage` — backend-specific fresh-store constructor passed in by callers."
    why: Per-subtest isolation without coupling the suite to any backend's constructor or cleanup.
  - name: RunAll
    kind: func
    role: Registers every `Test*` helper as a named `t.Run` subtest against the supplied `Factory`.
    why: Single entry point so a backend's `_test.go` opts into the full conformance matrix with one line.
  - name: TestRegisterAndGet
    kind: func
    role: Puts an HS256 secret, reads it back, asserts byte equality and `Algorithm == "HS256"`.
    why: Smoke test for the most basic Put/Get round-trip every backend must satisfy.
  - name: TestNotFound
    kind: func
    role: `GetKey` on an unknown client must return `keys.ErrKeyNotFound` (compared with `==`, not wrapped).
    why: Pins the sentinel error contract callers rely on for branchless miss handling.
  - name: TestMultipleHosts
    kind: func
    role: Verifies two distinct `ClientID`s hold distinct key material with no cross-talk.
    why: Catches backends that accidentally namespace-collapse or share a single bucket.
  - name: TestDeleteKey
    kind: func
    role: Put, delete, then assert subsequent `GetKey` returns `ErrKeyNotFound`.
    why: Ensures delete is observable to readers, not just locally cached.
  - name: TestDeleteNonexistent
    kind: func
    role: Deleting an unknown `ClientID` must return `ErrKeyNotFound`, not nil.
    why: Forces backends to distinguish "no-op delete" from "successful delete" loudly.
  - name: TestOverwriteKey
    kind: func
    role: Re-`PutKey` with the same `ClientID` swaps both key material and algorithm in place (HS256 -> HS512).
    why: Confirms upsert semantics so rotations (algorithm change, key change) are honoured.
  - name: TestListKeys
    kind: func
    role: After three Puts, `ListKeyIDs` returns exactly those three `ClientID`s (sorted-compared).
    why: Validates the admin/iteration surface every JWKS-like consumer depends on.
  - name: TestListKeysEmpty
    kind: func
    role: `ListKeyIDs` on a fresh store returns a zero-length slice with no error.
    why: Guards against backends that nil-panic, error, or leak a sentinel on the empty case.
  - name: TestPersistence
    kind: func
    role: Writes then re-reads through the same handle to prove data survives within a process.
    why: Single-process persistence floor; persistent backends satisfy it via shared underlying storage.
  - name: TestKidResolverBasic
    kind: func
    role: Stores an HS256 secret then resolves it via `GetKeyByKid` using `utils.ComputeKid(secret, "HS256")` as oracle; unknown kid yields `ErrKidNotFound`.
    why: Asserts the kid-index path matches the `ClientID` path for symmetric keys.
  - name: TestKidResolverAsymmetric
    kind: func
    role: Stores an RSA public-key PEM then resolves by kid computed off both PEM bytes and parsed `*rsa.PublicKey`, asserting they match.
    why: Pins the invariant that `ComputeKid(PEM)` equals `ComputeKid(parsedKey)` so backends can index either way.
  - name: TestGetCurrentKid
    kind: func
    role: `GetKey` must populate `KeyRecord.Kid` with the canonical thumbprint; miss must return `ErrKeyNotFound`.
    why: Callers stamp JWT headers from `rec.Kid` — backends that forget to fill it would break signing silently.
  - name: TestRegisterAndGetAsymmetricKey
    kind: func
    role: Round-trips an RSA public-key PEM through `PutKey`/`GetKey` and decodes it back via `utils.DecodeVerifyKey` into a `*rsa.PublicKey`.
    why: Guards the PEM-as-bytes contract so storage layers don't mangle or re-encode key material.
depends_on:
  - path: ../keys
    why: "Suite is parametrised over `keys.KeyStorage`; uses `keys.KeyRecord` for every Put/Get and pins `keys.ErrKeyNotFound` / `keys.ErrKidNotFound` as the exact sentinels backends must return."
  - path: ../utils
    why: "`utils.ComputeKid` is the oracle for `TestKidResolverBasic` / `TestKidResolverAsymmetric` / `TestGetCurrentKid`; `utils.GenerateRSAKeyPair` and `utils.DecodeVerifyKey` drive the RSA PEM round-trip in `TestRegisterAndGetAsymmetricKey`."
