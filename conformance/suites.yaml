# The external and cross-spec conformance suites `make conformance` runs.
#
# Each entry names a `conf-<name>` target in conformance/Makefile, which
# delegates to the suite's own target in the root Makefile. The runner
# (tests/conformance/cmd/suites) runs them in order, writes each log to
# test-reports/conformance/<name>.log, and prints one line per suite.
#
# Schema:
#   name:     suite name; its Makefile target is conf-<name>
#   kind:     gating (a failure fails `make conformance`), info (reported,
#             never fails the run), or manual (run by a person; make
#             conformance never runs it, and the report shows last_run)
#   covers:   what the suite checks, one line
#   source:   where its tests live
#   needs:    prerequisites. "docker" is informational; "env:VAR" makes the
#             runner skip the suite, with the reason, when VAR is unset
#   timeout:  Go duration bounding one run (default 20m). On expiry the runner
#             kills the suite's process group, reports it FAIL "timed out",
#             and goes on to the next suite.
#   plan:     for an OIDF exercise, the run's known-gaps.yaml plan key: the
#             harness plan name, or <plan>-<variant> for a plan run once per
#             variant. Its module results appear in
#             docs/conformance/REPORT.md. Optional.
#   tracking: the issue the suite belongs to, plain text. Optional.
#   note:     one line of context. Optional.
#   last_run: for a manual suite, its last run: date, commit, result (one
#             line for the report) and doc (where it's triaged). Required
#             for kind manual.
#
# The drift check (tests/conformance/cmd/suites, run by `make test`) fails
# when this file and conformance/Makefile disagree.

suites:
  - name: native
    kind: gating
    timeout: 10m
    covers: Go-native fixtures for RFC 8414 AS metadata, client authentication and RFC 7662 introspection, against known-gaps.yaml
    source: tests/conformance
    needs: []

  - name: oidf-config
    kind: gating
    timeout: 10m
    covers: OIDF oidcc-config-certification-test-plan, the discovery document check by check
    source: tests/oidf-conformance (TestOIDF_OIDCC_ConfigCert_Discovery)
    needs: [docker]
    note: The plan's one module; its per-check scorecard is tests/oidf-conformance/SCORECARD.md.

  - name: oidf-fapi2
    kind: gating
    timeout: 30m
    covers: OIDF fapi2-security-profile-final-test-plan, every module judged against known-gaps.yaml
    plan: fapi2-security-profile-final-test-plan
    source: tests/oidf-conformance/fapi2
    needs: [docker]
    tracking: "mission 98"

  - name: oidf-basic-op
    kind: gating
    timeout: 20m
    covers: OIDF oidcc-basic-certification-test-plan, every module judged against known-gaps.yaml
    plan: oidcc-basic-certification-test-plan
    source: tests/oidf-conformance/oidcc
    needs: [docker]
    tracking: "mission 477"

  - name: oidf-dynamic-op
    kind: gating
    timeout: 20m
    covers: OIDF oidcc-dynamic-certification-test-plan, the harness registering its own clients through RFC 7591
    plan: oidcc-dynamic-certification-test-plan
    source: tests/oidf-conformance/oidcdyn
    needs: [docker]
    tracking: "issue 493"

  - name: oidf-dynamic-id-token
    kind: gating
    timeout: 20m
    covers: OIDF oidcc-dynamic-certification-test-plan with response_type id_token, the opt-in implicit flow
    plan: oidcc-dynamic-certification-test-plan-id_token
    source: tests/oidf-conformance/oidcdyn
    needs: [docker]
    tracking: "issue 507"

  - name: oidf-dynamic-id-token-token
    kind: gating
    timeout: 20m
    covers: OIDF oidcc-dynamic-certification-test-plan with response_type "id_token token", the opt-in implicit flow
    plan: oidcc-dynamic-certification-test-plan-id_token_token
    source: tests/oidf-conformance/oidcdyn
    needs: [docker]
    tracking: "issue 507"

  - name: oidf-tp-post
    kind: gating
    timeout: 25m
    covers: OIDF oidcc-test-plan with client_secret_post clients
    plan: oidcc-test-plan-client_secret_post
    source: tests/oidf-conformance/oidcdyn
    needs: [docker]
    tracking: "issue 494"

  - name: oidf-tp-secret-jwt
    kind: gating
    timeout: 25m
    covers: OIDF oidcc-test-plan with client_secret_jwt clients
    plan: oidcc-test-plan-client_secret_jwt
    source: tests/oidf-conformance/oidcdyn
    needs: [docker]
    tracking: "issue 494"

  - name: oidf-tp-private-key-jwt
    kind: gating
    timeout: 25m
    covers: OIDF oidcc-test-plan with private_key_jwt clients
    plan: oidcc-test-plan-private_key_jwt
    source: tests/oidf-conformance/oidcdyn
    needs: [docker]
    tracking: "issue 494"


  - name: keycloak
    kind: gating
    timeout: 15m
    covers: Interop with a live Keycloak, as resource server and as client (tokens, DPoP, RAR, ID tokens)
    source: tests/keycloak
    needs: [docker]

  - name: authlete
    kind: info
    timeout: 15m
    covers: Interop with Authlete's java-oauth-server as the authorization server
    source: tests/authlete
    needs: [docker, "env:AUTHLETE_CLIENTID", "env:AUTHLETE_CLIENTSECRET"]
    note: Needs an Authlete service account, so it skips on a machine without one.

  - name: oauch
    kind: manual
    covers: OAuch (DistriNet) checks the reference server against RFC 6749, 6750, 6819, 7009, 7636, 9700 and OIDC, and against their threat models
    source: tests/oauch (server config); OAuch has only a web UI
    tracking: "issue 497"
    last_run:
      date: "2026-11-20"
      commit: c46fedf
      result: "107 tests, 13 failed (6 test setup, 3 gaps in issue 519, 4 tracked or accepted); 30 of 36 relevant threats mitigated"
      doc: docs/conformance/oauch.md
