# In-memory configuration for the FAPI 2.0 Security Profile: fapi2 turns on
# OneAuthConfig.FAPI2 (private_key_jwt only with the issuer as aud,
# confidential clients only, no password grant, PAR-only /authorize), and
# DPoP is configured the way FAPI asks: every access token
# sender-constrained, FAPI's proof algorithms, server nonces, and refresh
# tokens that aren't rotated (FAPI 2.0 §5.3.2.1). All data is lost on
# restart.
#
# Usage:
#   oneauth-server --config deploy-examples/fapi-dpop.yaml
#
# Behind a TLS-terminating proxy, set PUBLIC_URL to the URL clients use:
# DPoP proofs are checked against public_url + /api/token, and with the
# wrong value every proof fails.

server:
  port: ${PORT:-8080}
  host: 0.0.0.0
  public_url: ${PUBLIC_URL:-http://localhost:8080}

keystore:
  type: memory

user_stores:
  type: memory

jwt:
  # FAPI 2.0 §5.4.1 allows PS256, ES256 and EdDSA; oneauth signs with ES256.
  # Point JWT_PRIVATE_KEY_PATH at a P-256 PEM to keep tokens valid across
  # restarts. Without one the server makes a fresh key each start.
  signing_alg: ES256
  private_key_path: ${JWT_PRIVATE_KEY_PATH:-}
  ephemeral_signing_key: true
  # Still signs the login session cookies.
  secret_key: ${JWT_SECRET_KEY:-dev-secret-change-in-production!!}
  # Empty means the public URL, which keeps token iss and discovery in step.
  issuer: ${JWT_ISSUER}
  disable_refresh_token_rotation: true

admin_auth:
  type: none    # open registration, for dev only
  allow_open: true

dpop:
  enabled: true
  profile: fapi              # ES256, EdDSA, PS256
  require: true              # no proof, no token
  require_at_resource: true  # /api/* refuses bearer tokens
  nonce:
    required: true
    # Shared by every instance behind one URL. Empty keys nonces per process.
    secret: ${DPOP_NONCE_SECRET:-}

# FAPI 2.0 §5.3.2: needs dpop.enabled, and PAR whenever /authorize is on.
fapi2: true

code_flow:
  enabled: true
  par:
    enabled: true
