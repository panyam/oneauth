# The JARM mission's exercise server (issue 409): `make exercise-jarm`
# starts it and logs in with response_mode=jwt (scripts/exercise-jarm.sh).
#
# It runs the code flow with JARM on (issue 411) and an ephemeral ES256
# key, so a client checks a signed response against the same JWKS access
# tokens verify against. Open DCR lets the exercise register its loopback
# client, and the signup form gives it a user to approve consent as. All
# state is in memory.
#
# Usage:
#   oneauth-server --config deploy-examples/jarm.yaml

server:
  port: ${JARM_AS_PORT:-18500}
  host: 127.0.0.1
  public_url: http://localhost:${JARM_AS_PORT:-18500}

keystore:
  type: memory

user_stores:
  type: memory

jwt:
  issuer: ""
  signing_alg: ES256
  ephemeral_signing_key: true
  secret_key: ${JWT_SECRET_KEY:-jarm-exercise-session-secret-32by}

admin_auth:
  type: none    # the exercise registers its client through open DCR
  allow_open: true

code_flow:
  enabled: true
  jarm:
    enabled: true
