# Example oneauth-server configuration.
# Environment variables are substituted: ${VAR_NAME} or ${VAR_NAME:-default}
#
# Quick start:
#   export ADMIN_API_KEY="$(openssl rand -hex 32)"
#   go run ./cmd/oneauth-server
#
# Then register a host:
#   curl -X POST http://localhost:8080/hosts/register \
#     -H "X-Admin-Key: $ADMIN_API_KEY" \
#     -H "Content-Type: application/json" \
#     -d '{"client_domain": "myapp.com"}'

server:
  port: "${PORT:-8080}"
  host: "0.0.0.0"

# Where signing keys are stored.
# Options: memory, fs, gorm, gae
keystore:
  type: "${KEYSTORE_TYPE:-fs}"
  fs:
    path: "${KEYSTORE_PATH:-./data}"
  gorm:
    driver: "${GORM_DRIVER}"
    dsn: "${DATABASE_URL}"
  gae:
    project: "${GCP_PROJECT}"
    namespace: "${GAE_NAMESPACE}"

# User stores for auth pages (signup, login, password reset).
# Options: fs, gorm (when type=gorm, reuses keystore.gorm config)
user_stores:
  type: "${USER_STORES_TYPE:-fs}"
  fs:
    path: "${USER_STORES_PATH:-./data/server}"

# JWT signing for browser sessions and API tokens.
jwt:
  secret_key: "${JWT_SECRET_KEY}"
  issuer: "${JWT_ISSUER:-oneauth}"

# How admin endpoints are protected.
# Options: api-key, oidc (future), iap (future), none (dev only)
#
# IMPORTANT: Always use api-key or stronger in production.
# Generate a key: openssl rand -hex 32
admin_auth:
  type: "${ADMIN_AUTH_TYPE:-api-key}"
  api_key:
    key: "${ADMIN_API_KEY}"

# TLS (optional — typically terminated at the load balancer)
tls:
  enabled: false
  # cert: /etc/ssl/cert.pem
  # key: /etc/ssl/key.pem

# RFC 8628 Device Authorization Grant (optional, off by default).
# When enabled, mounts /device/authorize plus the /device + /device/approve
# user-facing verification UI, and advertises device_authorization_endpoint
# in AS metadata. CLI clients (oneauth token device, gcloud, GitHub CLI)
# can then complete OAuth without a local browser.
device_flow:
  enabled: ${DEVICE_FLOW_ENABLED:-false}
  # expiry: 15m   # RFC 8628 §3.4 default (15 minutes)
  # interval: 5   # RFC 8628 §3.5 default (5 seconds)
  store:
    type: "${DEVICE_AUTH_STORE_TYPE:-memory}"   # memory (default), fs, gorm, gae
    fs:
      path: "${DEVICE_AUTH_STORE_PATH:-./data/device}"
    # gorm and gae reuse the keystore.gorm / keystore.gae shape

# RFC 6749 §4.1 Authorization Code Grant + PKCE (optional, off by default).
# When enabled, mounts GET / POST /authorize (consent screen + decision),
# advertises authorization_endpoint, "code" in response_types_supported,
# and "authorization_code" in grant_types_supported. Headless / browser
# clients can then complete the canonical OAuth code flow against this
# AS. Pair with jwt.iss_parameter_supported=true to also emit RFC 9207
# `iss` on the redirect.
code_flow:
  enabled: ${CODE_FLOW_ENABLED:-false}
  # expiry: 60s   # default authorization-code lifetime (OAuth 2.1-aligned)
  store:
    type: "${AUTH_CODE_STORE_TYPE:-memory}"   # memory (default), gorm; fs / gae are deferred follow-ups
    # gorm reuses the keystore.gorm shape; uncomment to override:
    # gorm:
    #   driver: postgres
    #   dsn: "${AUTH_CODE_STORE_DSN}"
