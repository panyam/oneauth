package: keys
purpose: Signing-key storage, kid-based lookup, encryption-at-rest, grace-period rotation, and JWKS publication/consumption for OneAuth.
language: go
doc_file: doc.go
diagrams_file: diagrams.md
last_rebuilt: f4f2394f13eb05e20247c77dcbe437cb33db4f33
last_rebuilt_at: 2026-05-23T00:00:00Z
entities:
  - name: KeyRecord
    kind: struct
    role: Single value type carrying ClientID, Key, Algorithm, and Kid.
    why: Replaces scattered per-field accessors so decorators forward one value, not many getters.
  - name: KeyLookup
    kind: interface
    role: Read-only contract with GetKey(clientID) and GetKeyByKid(kid).
    why: Lets read-only sources like a remote JWKS plug in without implementing writes.
  - name: KeyStorage
    kind: interface
    role: KeyLookup plus PutKey, DeleteKey, and ListKeyIDs.
    why: ClientID-keyed write contract for persistent backends and the encryption decorator.
  - name: KidStorage
    kind: interface
    role: KeyLookup plus Add, Remove, and CleanExpired, keyed by kid.
    why: Lets retired grace-period keys persist across restarts in backends, not just process memory.
  - name: InMemoryKeyStore
    kind: struct
    role: Thread-safe in-memory KeyStorage with a kid to clientID secondary index.
    why: Keeps GetKeyByKid O(1) and consistent across overwrite and delete; default for tests and small deployments.
  - name: NewInMemoryKeyStore
    kind: func
    role: Constructor for an empty InMemoryKeyStore.
    why: Standard entry point for callers wiring an in-memory keystore.
  - name: EncryptedKeyStorage
    kind: struct
    role: KeyStorage decorator that AES-256-GCM encrypts HMAC secrets at rest while asymmetric keys pass through.
    why: Computes kid from plaintext before encryption so kid lookups still work; falls back to plaintext when decryption fails for pre-encryption migration.
  - name: NewEncryptedKeyStorage
    kind: func
    role: Builds the decorator from a 64-hex-character master key.
    why: Derives the AES key via HKDF-SHA256 with a fixed info string so the on-disk key is never the master key.
  - name: JWKSHandler
    kind: struct
    role: HTTP handler serving /.well-known/jwks.json from a KeyStore plus an optional KidStore.
    why: Publishes only asymmetric keys (HMAC secrets never leak) and supports ETag, If-None-Match, and Cache-Control conditional caching.
  - name: JWKSKeyStore
    kind: struct
    role: Read-only KeyLookup that fetches and caches public keys from a remote JWKS URL with background refresh.
    why: Cache misses trigger an on-demand refresh rate-limited by MinRefreshGap; GetSigningKey always errors since only public keys are available.
  - name: NewJWKSKeyStore
    kind: func
    role: Constructor accepting functional options for the JWKS client.
    why: Defaults RefreshInterval to 1h and MinRefreshGap to 5s; Start performs the initial fetch and launches the refresher.
  - name: JWKSOption
    kind: type
    role: Functional option for JWKSKeyStore configuration.
    why: WithHTTPClient, WithRefreshInterval, and WithMinRefreshGap follow the standard functional-options pattern.
  - name: KidStore
    kind: struct
    role: In-memory KidStorage holding kid to key mappings including time-expiring grace entries.
    why: A rotated-out key keeps validating tokens until its grace period lapses, then CleanExpired drops it.
  - name: NewKidStore
    kind: func
    role: Constructor for an empty KidStore.
    why: Standard entry point when grace-period rotation is wired in process memory.
  - name: CompositeKeyLookup
    kind: struct
    role: Tries multiple KeyLookups in order and returns the first hit.
    why: Combines a KeyStorage's current key with a KidStore's grace entries behind one read-side interface.
  - name: ErrKeyNotFound
    kind: const
    role: Sentinel error for a missing clientID lookup.
    why: Stable signal for callers and middleware that must branch on absence rather than format errors.
  - name: ErrAlgorithmMismatch
    kind: const
    role: Sentinel error when a key's algorithm does not match the expected JWT alg.
    why: Lets validation reject token-alg substitution attacks distinctly from key-missing errors.
  - name: ErrKidNotFound
    kind: const
    role: Sentinel error for an unknown or expired kid.
    why: Distinguishes grace-period expiry from a genuinely missing client registration.
