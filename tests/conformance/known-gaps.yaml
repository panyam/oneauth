# OneAuth conformance ratchet — see docs/CONFORMANCE.md §1.
#
# Every entry here is a test that runs in CI and is currently expected to
# fail. The runner asserts:
#
#   - failing tests not in this file → regression (CI red)
#   - passing tests in this file     → ratchet up; remove the entry  (CI red)
#   - missing tests for entries here → stale manifest; entry is dead (CI red)
#
# Schema:
#   suite     — required; package basename for Go-native, suite name for external
#   id        — Go-native: full Go test name including subtest path
#   plan/test — external suites only (OIDF, MCP); paired. For OIDF, `test`
#               carries the harness check-class identifier (`src` in the
#               log JSON), which is the stable per-check identifier across runs.
#   status    — "expected-fail"; external entries may also be "expected-review"
#               or "expected-skip" (see the FAPI 2.0 section at the end)
#   evidence  — expected-review only: text the captured page must contain
#   issue     — required GitHub issue number tracking the gap
#   owner     — GitHub handle responsible for closing the gap
#   reason    — multi-line; what is missing and why this is filed instead of fixed
#   expires   — ISO date; advisory only (consumed by the report, not the ratchet)
#
# External-suite entries (Plan + Test, no ID) are NOT enforced by this
# directory's Go-test runner — they belong to separate adapters that
# read this same manifest. For OIDF: tests/oidf-conformance/discovery_test.go
# runs the harness and diffs results. The Go-test runner skips external
# entries when checking for stale entries to avoid spurious red.

# (No Go-native expected-fail entries.) The first ratchet entry was
# `introspection/TestIntrospectClientAuth/post_auth_accepted` — the
# introspection endpoint accepting client_secret_post creds in the form
# body alongside Basic. Closed by issue 158 (private_key_jwt) which
# routed all three protected handlers through extractClientCredentials.

# =============================================================================
# OIDF conformance (external suite — driven by tests/oidf-conformance/)
# =============================================================================
# Each entry pins one of the OpenID Foundation conformance suite's per-check
# results. The `test` field carries the harness's check-class identifier
# (`src` in the harness log JSON), which is the stable identifier across runs.
# The discovery plan baseline + per-check rationale lives in
# `tests/oidf-conformance/baselines/2026-05-09/BASELINE.md`.

# The four metadata gaps gated on issue 116 (response_types_supported,
# id_token_signing_alg_values_supported, authorization_endpoint,
# userinfo_endpoint) closed under issue 339, when the baseline server
# turned on code_flow.oidc.

# Note: the baseline (2026-05-09) also flagged
# `OIDCCCheckDiscEndpointClaimsSupported`,
# `CheckDiscEndpointScopesSupportedContainsOpenId`, and the 5 HTTPS-
# protocol checks listed below. All seven closed under #250 — the
# scopes/claims pair closed when cmd/oneauth-server gained default
# populations; the HTTPS pair closed when cmd/oneauth-server's TLS
# mode was wired into the OIDF harness's docker-compose (cert + JVM
# truststore under tests/oidf-conformance/certs/).
#
# Previously-listed entries removed:
#   - OIDCCCheckDiscEndpointClaimsSupported
#   - CheckDiscEndpointScopesSupportedContainsOpenId
#   - CheckDiscEndpointDiscoveryUrl       (https-protocol)
#   - CheckDiscEndpointTokenEndpoint      (https-protocol)
#   - CheckDiscEndpointRegistrationEndpoint (https-protocol)
#   - CheckJwksUri                         (https-protocol)
#   - CheckDiscEndpointAllEndpointsAreHttps (aggregate)

# -----------------------------------------------------------------------------
# FAPI 2.0 Security Profile plan (mission issue 98)
# -----------------------------------------------------------------------------
# Enforced by tests/oidf-conformance/fapi2_plan_test.go through fapi2.Judge.
# Unlike the discovery entries above, `test` names a whole plan module, and
# two more statuses apply. `expected-review` is a module the harness ends in
# REVIEW (a screenshot a person signs off on); `evidence` is text the page
# the browser captured must contain, so a different error page still fails.
# `expected-skip` is a module the harness skips for this plan's config.
# `expected-warning` is a module whose only warnings come from the check
# its evidence names. Every other module has to pass.

- suite: oidf
  plan: fapi2-security-profile-final-test-plan
  test: fapi2-security-profile-final-ensure-unsigned-authorization-request-without-using-par-fails
  status: expected-review
  evidence: only through the pushed authorization request endpoint
  issue: 98
  owner: panyam
  reason: |
    FAPI 2.0 makes PAR mandatory, so /authorize refuses a direct request
    with oneauth's error page. The harness asks for a screenshot of it.
  expires: 2027-12-31

- suite: oidf
  plan: fapi2-security-profile-final-test-plan
  test: fapi2-security-profile-final-par-attempt-reuse-request_uri
  status: expected-review
  evidence: request_uri has already been used
  issue: 98
  owner: panyam
  reason: |
    A request_uri is single-use (RFC 9126 §2.2), so the second visit gets
    oneauth's error page. The harness asks for a screenshot of it.
  expires: 2027-12-31

- suite: oidf
  plan: fapi2-security-profile-final-test-plan
  test: fapi2-security-profile-final-par-attempt-to-use-expired-request_uri
  status: expected-review
  evidence: request_uri has expired
  issue: 98
  owner: panyam
  reason: |
    An expired request_uri gets oneauth's error page. The harness asks for
    a screenshot of it.
  expires: 2027-12-31

- suite: oidf
  plan: fapi2-security-profile-final-test-plan
  test: fapi2-security-profile-final-par-attempt-to-use-request_uri-for-different-client
  status: expected-review
  evidence: request_uri was not issued to this client
  issue: 98
  owner: panyam
  reason: |
    A request_uri presented with another client's client_id gets oneauth's
    error page. The harness asks for a screenshot of it.
  expires: 2027-12-31

- suite: oidf
  plan: fapi2-security-profile-final-test-plan
  test: fapi2-security-profile-final-ensure-signed-client-assertion-with-RS256-fails
  status: expected-skip
  issue: 330
  owner: panyam
  reason: |
    The harness runs this only with an RSA client key, and the plan's
    clients use ES256 because oneauth can't register a PS256 client yet
    (issue 330). The harness says the skip doesn't block certification.
  expires: 2027-12-31

- suite: oidf
  plan: fapi2-security-profile-final-test-plan
  test: fapi2-security-profile-final-happy-flow
  status: expected-warning
  evidence: non-requested claim 'typ'
  issue: 339
  owner: panyam
  reason: |
    oneauth's ID tokens carry a `typ: ID` claim so a resource server
    refuses one presented as an access token (checkAccessTokenKind), the
    marker Keycloak uses too. OIDC defines no marker, and a JOSE header
    typ other than JWT is refused by common relying-party libraries
    (Nimbus), so the claim stays and the harness warns that the client
    did not request it.
  expires: 2027-12-31

- suite: oidf
  plan: fapi2-security-profile-final-test-plan
  test: fapi2-security-profile-final-test-claims-parameter-identity-claims
  status: expected-skip
  issue: 453
  owner: panyam
  reason: |
    The harness skips this module because the discovery document does not
    advertise claims_parameter_supported; the OIDC `claims` request
    parameter is not implemented yet.
  expires: 2027-12-31
