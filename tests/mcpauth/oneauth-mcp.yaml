# cmd/oneauth-server as the authorization server for the MCP server-auth
# conformance suite (issue 495). scripts/exercise-mcpauth.sh starts it on
# :18200 beside an MCP fixture on :18300, with a signing key it generates
# per run, so the fixture can sign the bad-claim tokens with the same key.

server:
  port: ${MCPAUTH_AS_PORT:-18200}
  host: 127.0.0.1
  public_url: http://localhost:${MCPAUTH_AS_PORT:-18200}

keystore:
  type: memory

user_stores:
  type: memory

jwt:
  # Empty follows public_url, which the fixtures check iss against.
  issuer: ""
  signing_alg: RS256
  private_key_path: ${MCPAUTH_SIGNING_KEY}
  # Tokens are for the fixture's MCP endpoint, which refuses any other aud.
  audience: ${MCPAUTH_AUDIENCE:-http://localhost:18300/mcp}
  scopes_supported: [read, write, admin]
  secret_key: ${JWT_SECRET_KEY:-mcp-auth-exercise-session-secret-32b}

admin_auth:
  type: none    # the fixture registers its client through open DCR
  allow_open: true

# /authorize, so the AS advertises its RFC 9207 iss parameter like a real
# MCP authorization server, which runs the code flow.
code_flow:
  enabled: true

# The upstream IdP the MCP enterprise-managed scenarios assume (issue 521).
# The exercise generates its key pair; the fixture signs an assertion with
# the private half, which the AS takes through jwt-bearer and token exchange.
trusted_assertion_issuers:
  - issuer: ${MCPAUTH_IDP_ISSUER:-https://idp.mcpauth.test}
    public_key_path: ${MCPAUTH_IDP_PUBKEY}
