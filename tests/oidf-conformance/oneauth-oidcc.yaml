# cmd/oneauth-server for the OpenID Connect OP plans: Basic OP (mission 477,
# on 8890), Dynamic OP (issue 493, on 8891) and oidcc-test-plan (issue 494,
# on 8892). OIDCC_PORT picks the port; scripts/exercise-oidf.sh sets it. Each
# runs over TLS at the host name the OIDF harness container uses, beside the
# discovery baseline (8888) and the FAPI 2.0 server (8889).

server:
  port: ${OIDCC_PORT:-8890}
  host: 0.0.0.0
  public_url: https://host.docker.internal:${OIDCC_PORT:-8890}

tls:
  enabled: true
  cert: tests/oidf-conformance/certs/server.crt
  key: tests/oidf-conformance/certs/server.key

keystore:
  type: memory

user_stores:
  type: memory

jwt:
  # Empty follows public_url, which is what the harness checks iss against.
  issuer: ""
  # The Basic OP profile expects RS256 ID tokens (OIDC Core §15.1).
  signing_alg: RS256
  # A fresh key per run; the exercise starts a new server each time.
  ephemeral_signing_key: true
  # The Dynamic plan's server-rotate-keys module has the exercise rotate
  # the key through POST /admin/signing-key/rotate (issue 507).
  key_rotation:
    enabled: true
    grace_period: 1h
  secret_key: ${JWT_SECRET_KEY:-oidf-oidcc-exercise-session-secret-32b}

admin_auth:
  type: none    # the exercise registers its clients through open DCR
  allow_open: true
  # The Dynamic plan registers clients whose jwks_uri is on the harness,
  # which resolves to 127.0.0.1 (issue 507). Test harnesses only.
  allow_private_client_hosts: true
  # The harness serves those jwks_uris with a cert from this test CA.
  client_fetch_ca_file: tests/oidf-conformance/certs/ca.crt

# The harness logs the same user in once per module, dozens of times a
# minute; the default 10 a minute throttles it partway through the plan.
rate_limit:
  login_per_minute: 600

code_flow:
  enabled: true
  oidc: true
  # OIDC Core lets a confidential client omit PKCE, and the Basic OP plan's
  # clients send it in only one module.
  pkce: optional_for_confidential
  # prompt=none succeeds only for a request an earlier approval covers.
  consent:
    remember: true
  # Pairwise subject identifiers (issue 507), for the Dynamic plan's
  # sector_identifier_uri modules. A fixed test value: the server is fresh
  # every run anyway.
  pairwise_salt: oidf-exercise-pairwise-salt-not-a-secret
  # The opt-in implicit flow (issue 507), which an OIDC Dynamic OP must
  # support (OIDC Core §15.2). Clients still have to register for it.
  implicit: true

# The exercise user signs up with these standard OIDC profile claims
# (oidfplan.StandardProfile), so the modules that ask for claims find them.
signup:
  profile_claims: [name, given_name, family_name, middle_name, nickname, profile, picture, website, gender, birthdate, zoneinfo, locale, address]
