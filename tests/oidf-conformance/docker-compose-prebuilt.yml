services:
  mongodb:
    image: ${MONGODB_IMAGE:-mongo:6.0.13}
    # A named volume rather than a bind mount into the checkout: removing
    # the worktree that ran `make upoidf` deleted the database under the
    # running container (issue 438).
    volumes:
     - mongo-data:/data/db
    logging:
      driver: "json-file"
      options:
        max-size: "500k"
        max-file: "5"
  nginx:
    # Pinned to a release, as is the server image below, so CI and laptops
    # run the same harness and an upgrade is a deliberate change. The
    # registry's `latest` is older than the releases (April 2026), and a
    # digest disappears when GitLab's cleanup removes it (issue 498).
    # `curl -sk https://localhost.emobix.co.uk:8443/api/server` shows the
    # running harness's tag.
    image: registry.gitlab.com/openid/conformance-suite/nginx:${OIDF_HARNESS_TAG:-release-v5.3.3}
    ports:
     - "8443:8443"
    # A cert from certs/ca.crt in place of the image's self-signed one, so
    # oneauth-server can fetch a client's jwks_uri from the harness over
    # verified TLS (issue 507). certs/regen.sh makes it.
    volumes:
     - ./certs/harness.crt:/etc/ssl/certs/nginx-selfsigned.crt:ro
     - ./certs/harness.key:/etc/ssl/private/nginx-selfsigned.key:ro
    # The harness's headless browser runs in the server container, where
    # public DNS answers 127.0.0.1 for this name. The alias sends its
    # redirects to the harness callback (/test/a/<alias>/callback) here.
    networks:
      default:
        aliases:
         - localhost.emobix.co.uk
    depends_on:
     - server
    logging:
      driver: "json-file"
      options:
        max-size: "500k"
        max-file: "5"
  server:
    image: registry.gitlab.com/openid/conformance-suite:${OIDF_HARNESS_TAG:-release-v5.3.3}
    environment:
      BASE_URL: ${BASE_URL:-https://localhost.emobix.co.uk:8443}
      MONGODB_HOST: mongodb
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      OIDC_GOOGLE_CLIENTID: ${OIDC_GOOGLE_CLIENTID:-google-client}
      OIDC_GOOGLE_SECRET: ${OIDC_GOOGLE_SECRET:-google-secret}
      OIDC_GITLAB_CLIENTID: ${OIDC_GITLAB_CLIENTID:-gitlab-client}
      OIDC_GITLAB_SECRET: ${OIDC_GITLAB_SECRET:-gitlab-secret}
      # Trust the self-signed CA presented by cmd/oneauth-server's TLS
      # mode (issue 250). The truststore is regenerated alongside the
      # cert via tests/oidf-conformance/certs/regen.sh and committed.
      # Without this, the harness's JVM rejects the HTTPS handshake and
      # every TLS-protocol check fails with "unable to find valid
      # certification path."
      JAVA_TOOL_OPTIONS: >-
        -Djavax.net.ssl.trustStore=/oneauth-truststore/truststore.jks
        -Djavax.net.ssl.trustStorePassword=changeit
        -Djavax.net.ssl.trustStoreType=JKS
    volumes:
     - ./certs:/oneauth-truststore:ro
    # The harness reaches oneauth-server at host.docker.internal. Docker
    # Desktop resolves that name itself; Docker on Linux (CI) needs this
    # (issue 498).
    extra_hosts:
     - "host.docker.internal:host-gateway"
    depends_on:
     - mongodb
    logging:
      driver: "json-file"
      options:
        max-size: "500k"
        max-file: "5"

volumes:
  mongo-data:
