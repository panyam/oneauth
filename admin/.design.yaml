package: admin
purpose: OneAuth's client-administration surface — RFC 7591 Dynamic Client Registration, RFC 7592 self-service registration management, the proprietary /apps registry, admin-side CRUD, signing-key rotation with grace periods, and resource-token minting.
language: go
last_rebuilt: 57e6f0d2b10e75e7c3d4a352bd0a229beb99900e
last_rebuilt_at: 2026-05-24T17:31:10Z
entities:
  - name: AdminAuth
    kind: interface
    role: Authenticates inbound admin requests; returns nil on success or an error describing rejection.
    why: Pulled out as an interface so deployments can swap the API-key default for stronger mechanisms (mTLS, OIDC bearer) without touching handlers.
  - name: NoAuth
    kind: struct
    role: AdminAuth that accepts every request — explicitly marked dev/test only.
    why: Lets examples and tests stand up registrars without ceremony; named NoAuth (not "Default") so misuse is obvious in config.
  - name: APIKeyAuth
    kind: struct
    role: AdminAuth that validates an X-Admin-Key header with constant-time comparison.
    why: subtle.ConstantTimeCompare avoids leaking key length / prefix via timing differences.
  - name: ErrAdminUnauthorized
    kind: const
    role: Sentinel returned when admin auth header is missing (→ HTTP 401).
    why: Distinguished from ErrAdminForbidden so the HTTP wrapper can map missing vs wrong credentials to 401 vs 403.
  - name: ErrAdminForbidden
    kind: const
    role: Sentinel returned when admin credentials were supplied but do not match (→ HTTP 403).
    why: Lets operators distinguish "client forgot the header" from "wrong key" in logs and metrics.
  - name: AppRegistrationStore
    kind: interface
    role: Persistence contract (Save/Get/List/Delete) for app registration metadata; source of truth behind AppRegistrar's in-memory cache.
    why: Storage-agnostic per project convention — FS / GORM / GAE backends implement this without dragging persistence concerns into the registrar.
  - name: ErrAppNotFound
    kind: const
    role: Sentinel returned by GetApp / DeleteApp when the client_id is unknown.
    why: Lets callers branch on lookup misses without string-matching error messages.
  - name: InMemoryAppStore
    kind: struct
    role: Process-local AppRegistrationStore; clones values on every read and write.
    why: Clone-on-IO prevents callers from mutating cache entries by accident — the same defensive pattern AppRegistrar uses for its own in-memory map.
  - name: AppRegistration
    kind: struct
    role: Persistent record for one registered client — DCR metadata, OneAuth quota fields, and RFC 7592 management credentials.
    why: Schema is stable from #165 onwards so legacy entries (empty DCR fields) and DCR entries (empty quota fields) coexist in the same store without migration.
  - name: ClientRegistrar
    kind: interface
    role: Transport-agnostic ADMIN client surface (Register, RegisterLegacy, ListClients, GetClient, DeleteClient, RotateSecret).
    why: Methods are post-auth — the HTTP wrapper enforces AdminAuth before invoking them; the interface itself is unauthenticated by design so it expresses what admin ops exist, not who may invoke them.
  - name: ClientRegistrationManager
    kind: interface
    role: Transport-agnostic SELF-SERVICE management surface (RFC 7592 GetRegistration / UpdateRegistration / DeleteRegistration).
    why: Same domain as ClientRegistrar but a different security model — each call authenticates with the client's own registration_access_token, hence a second interface rather than overloading the admin one.
  - name: ErrUnauthorized
    kind: const
    role: Single uniform failure mode for every ClientRegistrationManager auth issue — wrong/missing token, unknown client_id, or token-less legacy registration.
    why: Refusing to distinguish prevents /apps/dcr/{client_id} from being used as a probe for valid client identifiers.
  - name: ErrInvalidClientMetadata
    kind: const
    role: Returned when an authenticated management request carries body that fails RFC 7591/7592 validation (→ HTTP 400).
    why: Distinct from ErrUnauthorized because the caller has already proven possession of the registration access token — refusing to distinguish would be needlessly cryptic.
  - name: AppRegistrar
    kind: struct
    role: Embeddable http.Handler and the single concrete implementation of both ClientRegistrar and ClientRegistrationManager.
    why: Persists through AppRegistrationStore (source of truth) while serving reads from an in-memory cache hydrated on construction and updated synchronously on every write.
  - name: NewAppRegistrar
    kind: func
    role: Constructor backed by an InMemoryAppStore — the test/dev default.
    why: Keeps the simple case one call; production callers reach for NewAppRegistrarWithStore.
  - name: NewAppRegistrarWithStore
    kind: func
    role: Constructor that hydrates the in-memory cache from a persistent AppRegistrationStore.
    why: ListApps errors during hydration are intentionally swallowed — a transient store hiccup at startup should not crash the host; callers wanting strict semantics call ListApps themselves first.
  - name: AppRegistrar.Register
    kind: method
    role: RFC 7591 DCR — assigns client_id, allocates a symmetric secret or stores a caller-supplied JWK, issues RFC 7592 §3 management credentials, persists the AppRegistration.
    why: ErrInvalidClientMetadata is mapped to HTTP 400; KeyStore / RNG failures bubble up as HTTP 500. ctx is threaded for future store async-ops.
  - name: AppRegistrar.RegisterLegacy
    kind: method
    role: Implements the proprietary /apps/register path that carries OneAuth-specific MaxRooms / MaxMsgRate quota fields DCR cannot express.
    why: Kept distinct from Register because the wire shape diverges; eventual removal tracked under issue #189.
  - name: AppRegistrar.ListClients
    kind: method
    role: Admin read of every registration; serves clones from the in-memory cache.
    why: Returned entries are clones so callers cannot mutate the cache through the response.
  - name: AppRegistrar.GetClient
    kind: method
    role: Admin read of a single registration by client_id.
    why: Distinct from ClientRegistrationManager.GetRegistration which authenticates with the client's own token — this path is reachable only by AdminAuth-passing callers.
  - name: AppRegistrar.DeleteClient
    kind: method
    role: Admin delete — removes the registration from Store + cache and invalidates the KeyStore entry.
    why: Store deletion happens before cache / credential invalidation so a store error leaves the registration intact and the call retryable.
  - name: AppRegistrar.RotateSecret
    kind: method
    role: Generates a fresh symmetric secret (or accepts a new asymmetric public key) for an existing client, optionally retaining the old key in KidStore for a grace period.
    why: KidStore.Add errors are surfaced (not swallowed) because silently dropping the old kid would advertise a grace period that didn't actually persist, rejecting in-flight tokens.
  - name: AppRegistrar.GetRegistration
    kind: method
    role: RFC 7592 §2.1 self-service read; gated by constant-time comparison of req.AccessToken against the stored registration_access_token.
    why: Omits client_secret intentionally — re-emitting it on every read enlarges the disclosure window if the management token is ever logged or proxied.
  - name: AppRegistrar.UpdateRegistration
    kind: method
    role: RFC 7592 §2.2 full-replacement update; rotates registration_access_token on success.
    why: Rejects token_endpoint_auth_method changes (out of scope for #169 — would require re-keying); clients that need to change auth method DELETE and re-register.
  - name: AppRegistrar.DeleteRegistration
    kind: method
    role: RFC 7592 §2.3 self-service delete; invalidates KeyStore credentials so already-issued tokens fail subsequent validation.
    why: Persists the store deletion before touching cache or KeyStore so a store error leaves the registration retryable and credentials bound.
  - name: AppRegistrar.SaveRegistration
    kind: method
    role: Persists a registration and updates the in-memory cache atomically (store first, then cache).
    why: Ordering keeps the cache from drifting ahead of the store on persist failure.
  - name: AppRegistrar.RLockApps
    kind: method
    role: Lends callers a read-locked view of the apps cache via a callback.
    why: Lets external code (e.g., apiauth) iterate without exposing the lock or the map itself.
  - name: AppRegistrar.Handler
    kind: method
    role: Builds an http.ServeMux mounting /apps, /apps/{id}, /apps/{id}/rotate, /apps/register, /apps/dcr, /apps/dcr/{client_id}.
    why: Relies on Go ServeMux longest-prefix matching so "/apps/dcr/" wins over "/apps/" without explicit ordering logic.
  - name: RegisterRequest
    kind: struct
    role: Input to ClientRegistrar.Register — RFC 7591 metadata plus the issuer base URL used to build registration_client_uri.
    why: IssuerBaseURL is a manager input (not a handler concern) so non-HTTP callers can supply it explicitly.
  - name: RegisterResponse
    kind: struct
    role: Wrapper around DCRResponse for the Register call.
    why: Wrapped per the gRPC-shape convention so forward-compat fields can be added without changing the method signature.
  - name: RegisterLegacyRequest
    kind: struct
    role: Input to RegisterLegacy — carries ClientDomain, SigningAlg, raw-PEM PublicKey, MaxRooms, MaxMsgRate.
    why: Concrete fields (not a map) so the proprietary wire shape stays reviewable in one place.
  - name: RegisterLegacyResponse
    kind: struct
    role: Proprietary /apps/register response shape.
    why: Mirrored as a typed struct for the same reason as the request — wire-format visibility.
  - name: ListClientsRequest
    kind: struct
    role: Empty placeholder for ListClients today.
    why: Exists so future pagination / filtering can be added without changing the method signature.
  - name: ListClientsResponse
    kind: struct
    role: Returns every registration as cloned values.
    why: Clones prevent callers from mutating the in-memory cache through the response.
  - name: GetClientRequest
    kind: struct
    role: Input to ClientRegistrar.GetClient (client_id only).
    why: Wrapped per convention so future filters / projections do not require a new method.
  - name: GetClientResponse
    kind: struct
    role: Returns the AppRegistration for the requested client.
    why: Wrapped per convention.
  - name: DeleteClientRequest
    kind: struct
    role: Input to ClientRegistrar.DeleteClient.
    why: Wrapped per convention.
  - name: DeleteClientResponse
    kind: struct
    role: Empty success signal.
    why: HTTP wire body ({"deleted":true,"client_id":...}) is a wrapper concern; the manager-level signal is "no error = success".
  - name: RotateSecretRequest
    kind: struct
    role: Input to RotateSecret — ClientID, optional PublicKey (required for asymmetric), and optional GracePeriod override.
    why: GracePeriod defaults walk down: request → AppRegistrar.DefaultGracePeriod → 24h.
  - name: RotateSecretResponse
    kind: struct
    role: Returns new key material — ClientSecret only for symmetric, PreviousKid + GracePeriod only when KidStore actually retained the old key.
    why: Empty fields signal "feature inactive for this rotation"; the HTTP wrapper marshals via a map so they vanish from the wire.
  - name: ErrInvalidPublicKey
    kind: const
    role: Sentinel for PEM that fails parse or does not match the registered alg (→ HTTP 400).
    why: Lets the HTTP wrapper switch on errors.Is rather than string-match.
  - name: ErrPublicKeyRequired
    kind: const
    role: Sentinel for asymmetric registration / rotation called without supplying public_key (→ HTTP 400).
    why: Same — clean error mapping for the wrapper.
  - name: GetRegistrationRequest
    kind: struct
    role: Input to ClientRegistrationManager.GetRegistration — client_id + bearer token.
    why: Wrapped per convention.
  - name: GetRegistrationResponse
    kind: struct
    role: Wraps DCRResponse for the management read.
    why: Wrapped per convention.
  - name: UpdateRegistrationRequest
    kind: struct
    role: Input to UpdateRegistration — client_id, bearer token, and a DCRRequest body treated as full replacement.
    why: Wrapper guarantees req.ClientID == req.Metadata.ClientID before the manager runs, removing that check from RFC logic.
  - name: UpdateRegistrationResponse
    kind: struct
    role: Returns the post-update registration including the rotated registration_access_token.
    why: Callers MUST persist the new token before discarding the old one — old token becomes invalid as soon as SaveRegistration succeeds.
  - name: DeleteRegistrationRequest
    kind: struct
    role: Input to DeleteRegistration — client_id + bearer token.
    why: Wrapped per convention.
  - name: DeleteRegistrationResponse
    kind: struct
    role: Empty success signal (RFC 7592 §2.3 returns 204 No Content).
    why: Forward-compat envelope so future deletion-receipt fields (if any) need no signature change.
  - name: DCRHandler
    kind: struct
    role: HTTP wrapper for ClientRegistrar.Register — parses RFC 7591 body, enforces AdminAuth, derives IssuerBaseURL fallback, calls the manager, formats the JSON response.
    why: All protocol logic lives behind ClientRegistrar; the handler is intentionally a thin transport adapter.
  - name: DCRHandler.ServeHTTP
    kind: method
    role: Implements http.Handler for POST /apps/dcr; rejects other methods with 405.
    why: Derives scheme + host fallback for IssuerBaseURL so test setups work without config, but production callers should set IssuerBaseURL explicitly (proxy-fragile).
  - name: DCRRequest
    kind: struct
    role: RFC 7591 registration body, reused as the RFC 7592 §2.2 update body.
    why: ClientID is ignored on register and validated by the wrapper on update — single struct keeps both wire shapes documented in one place.
  - name: DCRResponse
    kind: struct
    role: RFC 7591 registration response extended with RFC 7592 §3 registration_access_token + registration_client_uri.
    why: Single wire shape covers both initial registration and management read/update.
  - name: DCRManagementHandler
    kind: struct
    role: HTTP wrapper for ClientRegistrationManager covering GET / PUT / DELETE /apps/dcr/{client_id}.
    why: Routes by method; 405 leaks no client info because it depends on neither client_id nor auth.
  - name: DCRManagementHandler.ServeHTTP
    kind: method
    role: Dispatches by HTTP method; extracts client_id from the URL tail; bounds PUT bodies at 64 KiB.
    why: MaxBytesReader prevents unbounded JSON from exhausting memory; 64 KiB is generous for client metadata.
  - name: MintResourceToken
    kind: func
    role: Backwards-compatible API that issues an HS256 resource-scoped JWT from (userID, clientID, appSecret, quota, scopes, authzDetails).
    why: Thin wrapper over MintResourceTokenWithKey for legacy callers that always sign with a shared secret.
  - name: MintResourceTokenWithKey
    kind: func
    role: Issues a 15-min resource-scoped JWT auto-selecting HS256 / RS256 / ES256 from the key type, with a kid header derived from the key.
    why: Key-type → alg auto-selection prevents the caller from setting alg=HS256 with an RSA key (or vice versa) — the most common JWT footgun.
  - name: AppQuota
    kind: struct
    role: Per-app quota fields (MaxRooms, MaxMsgRate) embedded as custom claims in resource tokens.
    why: OneAuth-specific fields outside the RFC 7591/9396 vocabulary; carried as named struct (not free-form map) so callers cannot typo claim names.
