package: admin
purpose: OneAuth's client-administration surface — RFC 7591 Dynamic Client Registration, RFC 7592 self-service registration management, the proprietary /apps registry, admin-side CRUD, signing-key rotation with grace periods, and resource-token minting.
language: go
last_rebuilt: 0f92ff8dc5535ee2072db8f45cfc272788d41263
last_rebuilt_at: 2026-05-26T07:42:23Z
entities:
  - name: AdminAuth
    kind: interface
    role: Authenticates inbound admin requests; returns nil on success or an error describing rejection.
    why: Pulled out as an interface so deployments can swap the API-key default for stronger mechanisms (mTLS, OIDC bearer) without touching handlers.
  - name: NoAuth
    kind: struct
    role: AdminAuth that accepts every request — explicitly marked dev/test only.
    why: Named NoAuth (not "Default") so misuse is obvious at the call site and in config.
  - name: APIKeyAuth
    kind: struct
    role: AdminAuth that validates an X-Admin-Key header with constant-time comparison.
    why: subtle.ConstantTimeCompare avoids leaking key length / prefix via timing differences.
  - name: NewNoAuth
    kind: func
    role: Constructs a NoAuth admin authenticator.
    why: Constructor kept symmetric with NewAPIKeyAuth so handler wiring reads uniformly across auth modes.
  - name: NewAPIKeyAuth
    kind: func
    role: Constructs an APIKeyAuth bound to the given shared key.
    why: Key is captured at construction so request-time comparison has no I/O and timing stays constant.
  - name: NoAuth.Authenticate
    kind: method
    role: Always returns nil — every request is admitted.
    why: Lives behind the same interface as APIKeyAuth so swapping in production never changes call sites.
  - name: APIKeyAuth.Authenticate
    kind: method
    role: Reads X-Admin-Key, returns ErrAdminUnauthorized when missing, ErrAdminForbidden on mismatch.
    why: Split sentinels let the HTTP wrapper map missing vs wrong credentials to 401 vs 403 without re-parsing the header.
  - name: ErrAdminUnauthorized
    kind: var
    role: Sentinel returned when admin auth header is missing (→ HTTP 401).
    why: Distinguished from ErrAdminForbidden so HTTP wrappers can pick the right status without string-matching the error.
  - name: ErrAdminForbidden
    kind: var
    role: Sentinel returned when admin credentials were supplied but do not match (→ HTTP 403).
    why: Lets operators distinguish "client forgot the header" from "wrong key" in logs and metrics.
  - name: AppRegistrationStore
    kind: interface
    role: Persistence contract (Save/Get/List/Delete) for app registration metadata; source of truth behind AppRegistrar's in-memory cache.
    why: Storage-agnostic per project convention — FS / GORM / GAE backends implement this without dragging persistence concerns into the registrar.
  - name: InMemoryAppStore
    kind: struct
    role: Process-local AppRegistrationStore for tests and dev; state lost on restart.
    why: Stored values are cloned on every read/write so callers cannot mutate the map under the mutex.
  - name: NewInMemoryAppStore
    kind: func
    role: Constructs an empty InMemoryAppStore.
    why: Constructor (vs zero value) ensures the internal map is non-nil so SaveApp never panics.
  - name: InMemoryAppStore.SaveApp
    kind: method
    role: Insert-or-replace under write lock; rejects nil app or empty ClientID.
    why: Defensive validation here means buggy callers fail fast at the persistence boundary instead of corrupting the cache.
  - name: InMemoryAppStore.GetApp
    kind: method
    role: Returns ErrAppNotFound when clientID is unknown; otherwise a cloned AppRegistration.
    why: Clone-on-read is the cheap way to guarantee callers can't reach into the store's map by holding the returned pointer.
  - name: InMemoryAppStore.ListApps
    kind: method
    role: Returns a snapshot of every registration; order is unspecified.
    why: Unspecified ordering is intentional — letting callers depend on insertion order would lock in a property persistent backends might not provide.
  - name: InMemoryAppStore.DeleteApp
    kind: method
    role: Removes the registration or returns ErrAppNotFound.
    why: Explicit not-found vs silent-no-op so the admin delete handler can distinguish 404 from 200.
  - name: ErrAppNotFound
    kind: var
    role: Sentinel raised by stores and the registrar when a client_id has no registration.
    why: Shared sentinel lets every backend (in-memory, FS, GORM) signal the same condition without coupling to a backend type.
  - name: AppRegistration
    kind: struct
    role: Persisted record carrying both proprietary fields (MaxRooms, MaxMsgRate, SigningAlg) and RFC 7591 / 7592 client metadata + management credentials.
    why: One row backs both registration paths so the legacy and DCR surfaces can interoperate without a second schema; legacy entries simply leave the DCR fields empty.
  - name: AppRegistrar
    kind: struct
    role: Embeddable HTTP handler + ClientRegistrar/ClientRegistrationManager implementation tying KeyStorage, AppRegistrationStore, KidStorage, and AdminAuth together.
    why: Single struct owns the hot-path cache, all CRUD verbs, and the rotation logic so the HTTP layer can stay a thin parse/format wrapper.
  - name: NewAppRegistrar
    kind: func
    role: Convenience constructor backed by an in-memory store.
    why: Default that "just works" for tests and examples; production code reaches for NewAppRegistrarWithStore.
  - name: NewAppRegistrarWithStore
    kind: func
    role: Wires AppRegistrar to a caller-supplied store and hydrates the in-memory cache from it on startup.
    why: Hydration errors are swallowed — a transient store hiccup at boot must not crash the host process, and there's no caller-visible error channel for constructors.
  - name: AppRegistrar.Register
    kind: method
    role: ClientRegistrar impl for RFC 7591 DCR — assigns client_id, stores key/secret, mints RFC 7592 §3 management credentials, persists registration.
    why: Returns ErrInvalidClientMetadata for client errors and bubbles infra errors verbatim so the wrapper can map to 400 vs 500 cleanly.
  - name: AppRegistrar.RegisterLegacy
    kind: method
    role: ClientRegistrar impl for the proprietary /apps/register path carrying MaxRooms / MaxMsgRate quota.
    why: Kept distinct from Register because the wire shape diverges — fusing them would force every DCR call to round-trip quota fields RFC 7591 has no place for.
  - name: AppRegistrar.ListClients
    kind: method
    role: ClientRegistrar impl that returns clones of every cached registration.
    why: Reads from the hot-path cache instead of the store so listing is O(1) per entry and never blocks on a slow backend.
  - name: AppRegistrar.GetClient
    kind: method
    role: ClientRegistrar admin read — returns ErrAppNotFound when missing.
    why: Distinct from GetRegistration which authenticates via the client's own token; admin path returns full AppRegistration including quota fields.
  - name: AppRegistrar.DeleteClient
    kind: method
    role: ClientRegistrar admin delete — persists deletion, drops cache entry, best-effort KeyStore wipe.
    why: Store-first ordering means a backend failure leaves the registration intact and retryable; KeyStore is best-effort because a stranded key with no registration is unreachable anyway.
  - name: AppRegistrar.RotateSecret
    kind: method
    role: ClientRegistrar impl that rotates a client's key, optionally retaining the previous one in KidStore for a grace period.
    why: KidStore.Add failures hard-fail the rotation — silently dropping the old kid would advertise a grace period that wasn't actually persisted, invalidating in-flight tokens.
  - name: AppRegistrar.SaveRegistration
    kind: method
    role: Persists to the store first, then updates the in-memory cache only on success.
    why: Store-before-cache ordering keeps the cache from going out of sync with the source of truth on backend errors.
  - name: AppRegistrar.GetRegistration
    kind: method
    role: ClientRegistrationManager impl for RFC 7592 GET — constant-time token compare, blanket ErrUnauthorized on any failure.
    why: Uniform error envelope prevents /apps/dcr/{client_id} from being used as an enumeration probe for valid client_ids.
  - name: AppRegistrar.UpdateRegistration
    kind: method
    role: ClientRegistrationManager impl for RFC 7592 PUT — full replacement of editable fields, rotates registration_access_token on success.
    why: Token rotation is the spec's recommended pattern; locking TokenEndpointAuthMethod keeps the update path from triggering an implicit re-keying.
  - name: AppRegistrar.DeleteRegistration
    kind: method
    role: ClientRegistrationManager impl for RFC 7592 DELETE — self-service deletion authenticated by the registration access token.
    why: Same store-first ordering as DeleteClient; the spec's "MUST invalidate all tokens" is satisfied by dropping the KeyStore entry, since signature validation will then fail.
  - name: AppRegistrar.RLockApps
    kind: method
    role: Read-locked callback giving callers a transient view of the cache map.
    why: Lets advanced callers (token validation, metrics) walk registrations without exposing the mutex or making copies.
  - name: AppRegistrar.Handler
    kind: method
    role: Builds the http.Handler mux mounting register/dcr/dcr-mgmt/list/get/delete/rotate endpoints.
    why: Relies on ServeMux longest-prefix matching so /apps/dcr/ wins over /apps/ without manual ordering — the comment exists because that property is load-bearing.
  - name: ClientRegistrar
    kind: interface
    role: Transport-agnostic core for admin-side client operations: Register, RegisterLegacy, ListClients, GetClient, DeleteClient, RotateSecret.
    why: Matches the gRPC-shape convention (ctx, *Req → *Resp, error) so HTTP handlers stay thin and a gRPC port (#175) becomes a transport swap, not a rewrite.
  - name: ClientRegistrationManager
    kind: interface
    role: Transport-agnostic core for the self-service RFC 7592 management surface — GetRegistration, UpdateRegistration, DeleteRegistration.
    why: Kept distinct from ClientRegistrar because the security models differ (registration_access_token vs AdminAuth) — fusing them would conflate authorization scopes that should never share an implementation.
  - name: RegisterRequest
    kind: struct
    role: Input to ClientRegistrar.Register — carries RFC 7591 metadata plus an IssuerBaseURL used to construct registration_client_uri.
    why: IssuerBaseURL is part of the request rather than the registrar so the HTTP wrapper can fall back to scheme + r.Host without leaking transport details into AppRegistrar.
  - name: RegisterResponse
    kind: struct
    role: Wraps a *DCRResponse so future forward-compat fields can be added without changing the method signature.
    why: Same per-method response struct discipline gRPC enforces — futureproof without forcing callers to chase nil pointers.
  - name: RegisterLegacyRequest
    kind: struct
    role: Input to the proprietary /apps/register path with ClientDomain / SigningAlg / PublicKey / MaxRooms / MaxMsgRate.
    why: Fields named to match the legacy JSON wire shape exactly so the HTTP handler can decode straight into this struct.
  - name: RegisterLegacyResponse
    kind: struct
    role: Output of /apps/register with concrete typed fields rather than a free-form map.
    why: Concrete fields put the wire shape in one reviewable place; the HTTP wrapper marshals each field with its existing JSON tag.
  - name: ListClientsRequest
    kind: struct
    role: Currently empty placeholder for ClientRegistrar.ListClients.
    why: Empty struct preserves the (ctx, *Req → *Resp) shape so future filters/paging fit without breaking signatures.
  - name: ListClientsResponse
    kind: struct
    role: Returns []*AppRegistration of cloned registrations.
    why: Clone semantics live at the implementation boundary so callers can't mutate the cache via the returned slice.
  - name: GetClientRequest
    kind: struct
    role: ClientID-only input to ClientRegistrar.GetClient.
    why: Wrapper struct (not a string param) preserves the shape convention and admits future filters (include_secret?).
  - name: GetClientResponse
    kind: struct
    role: Wraps the *AppRegistration result.
    why: Returning AppRegistration (not DCRResponse) gives admin callers the proprietary fields (quota, MaxRooms) DCR has no place for.
  - name: DeleteClientRequest
    kind: struct
    role: ClientID-only input to ClientRegistrar.DeleteClient.
    why: Shape symmetry with GetClientRequest; empty response is enough because "no error" is the success signal.
  - name: DeleteClientResponse
    kind: struct
    role: Empty marker for successful admin delete.
    why: Wire-format details ({"deleted": true, ...}) belong in the wrapper, not the manager.
  - name: RotateSecretRequest
    kind: struct
    role: Input carrying ClientID + optional PublicKey + GracePeriod for ClientRegistrar.RotateSecret.
    why: PublicKey is required only for asymmetric algs (enforced in the impl); GracePeriod = 0 defers to AppRegistrar.DefaultGracePeriod for sane defaults.
  - name: RotateSecretResponse
    kind: struct
    role: New key material plus optional PreviousKid/GracePeriod when KidStore retained the old key.
    why: Optional fields signal whether grace retention actually happened so the wrapper emits previous_kid/grace_period only when meaningful.
  - name: ErrInvalidPublicKey
    kind: var
    role: Sentinel for malformed PEM public-key bodies (→ HTTP 400 invalid_request).
    why: Separating it from ErrPublicKeyRequired lets the wrapper return a specific message instead of conflating "missing" with "malformed".
  - name: ErrPublicKeyRequired
    kind: var
    role: Sentinel raised when an asymmetric registration/rotation omits the public key (→ HTTP 400).
    why: Caller-fixable error worth distinguishing so the wrapper can return invalid_request rather than a generic server_error.
  - name: GetRegistrationRequest
    kind: struct
    role: Input to ClientRegistrationManager.GetRegistration carrying ClientID + the bearer registration_access_token.
    why: Token travels in the request (not a context) so the same interface is reusable from non-HTTP transports (gRPC metadata, in-process tests).
  - name: GetRegistrationResponse
    kind: struct
    role: Wraps a *DCRResponse — the RFC 7591/7592 client-metadata shape.
    why: Echoes RFC 7591 fields but omits client_secret on read to avoid widening the disclosure window through the registration access token.
  - name: UpdateRegistrationRequest
    kind: struct
    role: PUT input carrying ClientID, AccessToken, and a *DCRRequest treated as full-replacement metadata.
    why: Full-replacement (not PATCH) is what RFC 7592 §2.2 specifies — fields omitted from Metadata are cleared on the server.
  - name: UpdateRegistrationResponse
    kind: struct
    role: Returns the post-update DCRResponse, including the rotated registration_access_token.
    why: Token rotation forces clients to re-read the response — losing the new token strands the registration from further self-service updates.
  - name: DeleteRegistrationRequest
    kind: struct
    role: Self-service delete input — ClientID plus the registration_access_token.
    why: Shape symmetry with the other manager requests; the access token is required for every verb under the same auth contract.
  - name: DeleteRegistrationResponse
    kind: struct
    role: Empty marker for successful self-service delete.
    why: RFC 7592 §2.3 returns 204 No Content; an empty struct preserves room for future forward-compat fields without changing the signature.
  - name: ErrUnauthorized
    kind: var
    role: Single failure mode for any auth problem on the management protocol.
    why: Uniform error is the no-enumeration guard — distinguishing "wrong token" from "unknown client" would turn the endpoint into a probe.
  - name: ErrInvalidClientMetadata
    kind: var
    role: Indicates an authenticated request whose body fails RFC 7591/7592 validation (→ HTTP 400).
    why: Only meaningful post-auth — if the caller already proved possession of the token, refusing to distinguish a body error would be needlessly cryptic.
  - name: DCRHandler
    kind: struct
    role: HTTP wrapper at POST /apps/dcr that authenticates the caller and delegates to AppRegistrar.Register.
    why: Holds the IssuerBaseURL fallback (scheme + r.Host) so the registrar stays transport-agnostic.
  - name: DCRRequest
    kind: struct
    role: RFC 7591 / 7592 client-metadata payload — also reused as the PUT update body.
    why: Same struct on register and update because the field set is identical; the wrapper enforces ClientID presence/match only on PUT.
  - name: DCRResponse
    kind: struct
    role: RFC 7591 §3.2.1 response body extended with RFC 7592 §3 management credentials (registration_access_token, registration_client_uri).
    why: Single response type for both register and read so clients can deserialize uniformly; ClientSecret is intentionally omitted on GET reads.
  - name: DCRHandler.ServeHTTP
    kind: method
    role: Parses RFC 7591 DCR requests, authenticates, calls AppRegistrar.Register, emits the RFC 7591 response.
    why: Falls back to scheme + r.Host for IssuerBaseURL only when not configured — fine for tests, unreliable behind proxies, hence the comment urging explicit config.
  - name: DCRManagementHandler
    kind: struct
    role: HTTP transport for the RFC 7592 verb trio at /apps/dcr/{client_id} — delegates GET/PUT/DELETE to a ClientRegistrationManager.
    why: Single struct routes by Method and shares all the cache/error/auth boilerplate; non-supported verbs get 405 with the Allow header.
  - name: DCRManagementHandler.ServeHTTP
    kind: method
    role: Extracts client_id from the path, switches on Method, returns 405 with Allow header for unsupported verbs.
    why: 405 is emitted before any per-client lookup so unsupported methods leak no information about client existence.
  - name: AppQuota
    kind: struct
    role: Per-app quota limits (MaxRooms, MaxMsgRate) embedded as custom JWT claims.
    why: Carried inside the access token so resource servers can enforce quota without an extra round-trip to the AS.
  - name: MintResourceToken
    kind: func
    role: HS256-only convenience that signs a resource-scoped JWT for a (user, app) pair using the app's shared secret.
    why: Backwards-compatible wrapper kept for callers that hold a string secret and don't want to think about key types.
  - name: MintResourceTokenWithKey
    kind: func
    role: Mints a resource-scoped JWT, auto-selecting HS256 / RS256 / ES256 from the key type.
    why: Single entry point for symmetric and asymmetric signing so callers don't pick the wrong jwt.SigningMethod by hand; computes kid automatically when possible.
