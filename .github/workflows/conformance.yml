name: Conformance

# Every suite in conformance/suites.yaml, through `make conformance`, the
# same target as a laptop (issue 571). That covers the OIDF plans, native,
# Keycloak, JARM, the MCP server-auth suites, OAuch, and Authlete when its
# secrets are set. A run takes about an hour, so it runs nightly and on
# demand rather than per PR. It also runs on a PR that changes this file, so
# a workflow change gets one real run before it merges.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/conformance.yml

# Read-only token by default; a job that needs more says so.
permissions:
  contents: read

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Every open gap in known-gaps.yaml must cite an open issue (mission 489).
  gapcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Open gaps cite open issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/check-known-gaps.sh

  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      # The MCP server-auth suites run the conformance framework through npx,
      # and the TS fixture through pnpm, the version its package.json pins.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Enable pnpm
        run: corepack enable

      # OAuch's run drives Chromium through playwright-go. On Linux the
      # browser needs system libraries, which --with-deps installs.
      - name: Install Chromium for the OAuch run
        run: cd tests/oauch && go run github.com/mxschmitt/playwright-go/cmd/playwright install --with-deps chromium

      # The runner skips Authlete, with the reason, when these are unset.
      - name: Run every conformance suite
        env:
          AUTHLETE_SERVICEID: ${{ secrets.AUTHLETE_SERVICEID }}
          AUTHLETE_ACCESS_TOKEN: ${{ secrets.AUTHLETE_ACCESS_TOKEN }}
          AUTHLETE_CLIENTID: ${{ secrets.AUTHLETE_CLIENTID }}
          AUTHLETE_CLIENTSECRET: ${{ secrets.AUTHLETE_CLIENTSECRET }}
        run: make conformance

      # The server logs go under test-reports/, so every path in the
      # artifact stays relative to the checkout. pages.yml copies the
      # artifact's docs/conformance/ over its own to publish the report.
      - name: Report
        if: always()
        run: |
          cat docs/conformance/REPORT.md >> "$GITHUB_STEP_SUMMARY"
          mkdir -p test-reports/server-logs
          cp /tmp/oneauth-*.log test-reports/server-logs/ 2>/dev/null || true

      - name: Keep the logs and the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance
          path: |
            test-reports/conformance/
            test-reports/oauch/
            test-reports/server-logs/
            docs/conformance/report.json
            docs/conformance/REPORT.md
          retention-days: 14

  # One tracking issue, labeled conformance-nightly. A failed nightly or
  # manual run opens it, or comments on it when it's already open, listing
  # the suites that failed. The next green run closes it.
  notify:
    needs: conformance
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: conformance
          path: nightly

      - name: Open, update or close the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ needs.conformance.result }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          issue=$(gh issue list --label conformance-nightly --state open --json number --jq '.[0].number // empty')
          if [ "$RESULT" = success ]; then
            if [ -n "$issue" ]; then gh issue close "$issue" --comment "Conformance passes again: $run_url"; fi
            exit 0
          fi
          failing=$(jq -r '.suites[] | select(.result == "FAIL") | "- `\(.name)` (\(.kind)): \(.detail)"' nightly/docs/conformance/report.json 2>/dev/null || true)
          [ -n "$failing" ] || failing="- No suite reported FAIL, so the job itself stopped ($RESULT). The run's log says where."
          body=$(printf 'The %s conformance run on %s ended with %s.\n\n%s\n\nRun: %s\nThe artifact `conformance` holds each suite'"'"'s log.\n' "$GITHUB_EVENT_NAME" "${GITHUB_SHA:0:7}" "$RESULT" "$failing" "$run_url")
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$body"
          else
            gh label create conformance-nightly --color B60205 --description "Opened and closed by the nightly conformance run" --force
            gh issue create --title "Nightly conformance is failing" --label conformance-nightly --label P1 --body "$body"
          fi
