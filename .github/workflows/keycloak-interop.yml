name: Keycloak Interop Tests

# Runs `make testkcl`, the same target used locally, so CI and a laptop start
# Keycloak the same way: `docker run` with `--features=dpop` (a `services:`
# block cannot pass arguments to the container's command), the realm imported
# at boot, the image pinned by KC_IMAGE in the Makefile, and the RAR test
# issuer on 8181.
#
# Runs on PRs that touch the code these tests exercise, on pushes to main,
# and by hand from Actions → Keycloak Interop Tests → Run workflow.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apiauth/**"
      - "client/**"
      - "keys/**"
      - "core/**"
      - "cmd/oneauth-server/**"
      - "tests/keycloak/**"
      - "Makefile"
      - ".github/workflows/keycloak-interop.yml"
  pull_request:
    paths:
      - "apiauth/**"
      - "client/**"
      - "keys/**"
      - "core/**"
      - "cmd/oneauth-server/**"
      - "tests/keycloak/**"
      - "Makefile"
      - ".github/workflows/keycloak-interop.yml"

# Read-only token by default; a job that needs more says so.
permissions:
  contents: read

jobs:
  keycloak-interop:
    runs-on: ubuntu-latest
    # The Makefile's readiness loops have no timeout of their own.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26'

      - name: Run Keycloak interop tests
        run: make testkcl

      - name: Keycloak logs
        if: failure()
        run: docker logs oneauth-test-keycloak 2>&1 | tail -200

      - name: Stop Keycloak
        if: always()
        run: make downkcl
