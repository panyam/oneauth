name: Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'docs/site/**'
      - 'docs/**.md'
      - 'docs/conformance/**.md'
      - 'docs/gaps/**.md'
      - 'tests/oidf-conformance/SCORECARD.md'
      - 'README.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  # A finished nightly or manual conformance run republishes the site with
  # that run's report (issue 571).
  workflow_run:
    workflows: [Conformance]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # A conformance run on a PR doesn't publish.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.event != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The run's artifact holds docs/conformance/ as that run left it. When
      # the run left no artifact, the site keeps the committed report.
      - name: Take the conformance run's report
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: conformance
          path: .
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: docs/site/go.mod

      - name: Build site
        working-directory: docs/site
        run: make build

      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: docs/site/dist/docs
          retention-days: 7

  deploy:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_run'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: docs-site
          path: dist

      - name: Publish to gh-pages branch
        # Third-party action pinned by commit SHA (v4.1.0). Bump only
        # via Dependabot/Renovate or a deliberate manual review — never
        # by floating tag.
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          commit_message: 'Deploy OneAuth docs site (${{ github.sha }})'
