name: OIDF Conformance

# Every OpenID Foundation plan oneauth claims (FAPI 2.0, OIDC Basic OP,
# Dynamic OP with code and the implicit types, oidcc-test-plan per client
# auth method), each judged against tests/conformance/known-gaps.yaml. It
# runs `make testoidf`, the same target as a laptop, so the two can't
# drift (issue 498). A full run takes about 30 minutes, so it runs nightly
# and on demand rather than per PR.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

# Read-only token by default; a job that needs more says so.
permissions:
  contents: read

concurrency:
  group: oidf-conformance
  cancel-in-progress: false

jobs:
  testoidf:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26'

      # make upoidf waits for the harness with scripts/wait-for.sh, which
      # gives up after 300 seconds rather than hanging the job.
      - name: Start the OIDF harness
        run: make upoidf

      - name: Run every OIDF plan
        run: make testoidf

      - name: Show logs on failure
        if: failure()
        run: |
          for f in /tmp/oneauth-*.log; do echo "=== $f"; tail -n 100 "$f"; done
          echo "=== harness server"
          docker compose -f tests/oidf-conformance/docker-compose-prebuilt.yml logs --tail=200 server || true

      - name: Keep the server logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oidf-server-logs
          path: /tmp/oneauth-*.log
          retention-days: 7
