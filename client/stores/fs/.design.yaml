package: fs
purpose: A filesystem-backed credential store that persists oneauth client server credentials as a single JSON file keyed by normalized server URL.
language: go
doc_file: doc.go
last_rebuilt: ead2b4a0eb7a36818650e3d4dfa6968277d8a5ac
last_rebuilt_at: 2026-05-22T18:29:59Z
entities:
  - name: FSCredentialStore
    kind: struct
    role: In-memory map of server credentials backed by a JSON file, guarded by a RWMutex.
    why: Mutations only touch memory and set a modified flag; nothing hits disk until Save is called explicitly.
  - name: NewFSCredentialStore
    kind: func
    role: Constructs a store, defaulting path to ~/.config/<appName>/credentials.json and eagerly loading any existing file.
    why: A missing file is not an error (os.IsNotExist is tolerated), so first-run callers get an empty usable store.
  - name: FSCredentialStore.GetCredential
    kind: method
    role: Looks up a credential by normalized server URL.
    why: Returns (nil, nil) on a miss rather than an error, so callers must nil-check the credential, not just err.
  - name: FSCredentialStore.SetCredential
    kind: method
    role: Stores a credential under its normalized URL key and marks the store dirty.
    why: Does not write to disk; pairs with Save to batch persistence.
  - name: FSCredentialStore.RemoveCredential
    kind: method
    role: Deletes a credential by normalized URL key and marks the store dirty.
    why: Like Set, defers actual file rewrite to Save.
  - name: FSCredentialStore.ListServers
    kind: method
    role: Returns all normalized server URL keys currently held.
    why: Returns the normalized form (scheme://host), not the original input strings.
  - name: FSCredentialStore.Save
    kind: method
    role: Persists the map to disk as indented JSON if modified, creating the dir 0700 and file 0600.
    why: No-ops when nothing changed; restrictive perms because the file holds secrets.
  - name: FSCredentialStore.Path
    kind: method
    role: Returns the resolved path to the credentials file.
    why: Lets callers report or locate the file after default-path resolution.
depends_on:
  - path: ../..
    entities: [ServerCredential]
