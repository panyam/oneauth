package: core
purpose: Foundation types, store interfaces, token/scope primitives, and pluggable security helpers shared by every OneAuth package.
language: go
doc_file: doc.go
diagrams_file: diagrams.md
last_rebuilt: f4f2394f13eb05e20247c77dcbe437cb33db4f33
last_rebuilt_at: 2026-05-23T00:00:00Z
entities:
  - name: User
    kind: interface
    role: Unified account abstraction exposing Id() and Profile().
    why: Lets backends supply their own row type while the rest of OneAuth talks to a stable shape.
  - name: BasicUser
    kind: struct
    role: Trivial in-memory User implementation.
    why: Default fallback for callers and tests that have no backing store row.
  - name: Identity
    kind: struct
    role: Verifiable contact (email/phone) owned by one user, with optimistic-locking Version.
    why: Keeps verification state per-contact so one user can own many addresses.
  - name: Channel
    kind: struct
    role: Per-provider auth credentials (local/google/github) keyed by IdentityKey, with ExpiresAt and IsExpired.
    why: Layers multiple login methods onto a single Identity while preserving re-auth signals.
  - name: IdentityKey
    kind: func
    role: Builds the canonical "type:value" key that links Channels to Identities.
    why: Single source of truth for that key format so callers cannot drift.
  - name: HandleUserFunc
    kind: type
    role: Post-auth callback receiving the OAuth token, userInfo, and http writer/request.
    why: The seam that keeps core transport-agnostic — apps decide what session to issue.
  - name: UserStore
    kind: interface
    role: CRUD plus get-or-create for User rows.
    why: Decomposed by concern so backends do not implement a god interface.
  - name: IdentityStore
    kind: interface
    role: Manage Identity rows with verification and user-association.
    why: Folds lookup and provisioning into one call via createIfMissing.
  - name: ChannelStore
    kind: interface
    role: Manage Channel rows keyed by provider plus identity key.
    why: Separates auth-provider state from contact state.
  - name: RefreshTokenStore
    kind: interface
    role: Refresh-token lifecycle with rotation and family-based theft detection.
    why: RotateRefreshToken returns ErrTokenReused on an already-revoked token, signaling theft.
  - name: APIKeyStore
    kind: interface
    role: API-key lifecycle returning the full key once and storing only a hash.
    why: Makes secret loss the user's problem, not the store's exposure.
  - name: UsernameStore
    kind: interface
    role: Optional username uniqueness and atomic rename.
    why: Optional because the unified model keys on identities, not usernames.
  - name: TokenStore
    kind: interface
    role: Storage for short-lived verification and reset AuthTokens.
    why: Kept distinct from refresh tokens (different lifetimes, no rotation/family).
  - name: AuthToken
    kind: struct
    role: Verification or password-reset token.
    why: IsValid checks both type and expiry to block cross-purpose reuse.
  - name: TokenType
    kind: type
    role: Enum of token kinds (email_verification, password_reset, refresh).
    why: One typed namespace so AuthToken.IsValid can compare safely.
  - name: RefreshToken
    kind: struct
    role: Long-lived API token carrying Family, Generation, scopes, and RFC 9396 details.
    why: Enables rotation-with-theft-detection across a token lineage.
  - name: APIKey
    kind: struct
    role: Long-lived programmatic key (public KeyID plus bcrypt KeyHash) with optional expiry.
    why: Nil ExpiresAt means never-expires; bcrypt hash means the secret is unrecoverable.
  - name: TokenPair
    kind: struct
    role: OAuth token-endpoint response payload.
    why: Carries IssuedTokenType for RFC 8693 token-exchange responses only.
  - name: TokenRequest
    kind: struct
    role: OAuth token-endpoint request payload, a union over grant types.
    why: Keeps Assertion (resource-owner) and ClientAssertion (client auth) deliberately separate.
  - name: TokenError
    kind: struct
    role: OAuth 2.0 wire-format error.
    why: Standard error and error_description envelope for token responses.
  - name: GenerateSecureToken
    kind: func
    role: Crypto-random 32-byte hex token generator.
    why: Centralizes randomness for verification and reset tokens.
  - name: GenerateAPIKeyID
    kind: func
    role: Generates a key ID prefixed with "oa_".
    why: Prefix keeps API keys identifiable in logs and grep.
  - name: GenerateAPIKeySecret
    kind: func
    role: Generates the secret half of an API key.
    why: Pairs with GenerateAPIKeyID and is what gets bcrypted.
  - name: AuthorizationDetail
    kind: struct
    role: A single RFC 9396 authorization_details object with custom JSON marshalling.
    why: Flattens Extra extension fields to top-level and rejects collisions with common keys.
  - name: AuthorizationDetail.Validate
    kind: method
    role: Validates a single detail; only Type is required.
    why: Matches RFC 9396 minimum-required-field semantics.
  - name: ValidateAll
    kind: func
    role: Validates a slice of AuthorizationDetail.
    why: Convenience over per-item Validate when handling a request list.
  - name: FilterByType
    kind: func
    role: Selects details by Type.
    why: Lets callers route subsets to different policy handlers.
  - name: ErrInvalidAuthorizationDetails
    kind: const
    role: Sentinel error for malformed authorization_details (RFC 9396 section 5.2).
    why: Lets callers wrap and identify the OAuth-compliant error code.
  - name: SignupPolicy
    kind: struct
    role: Declarative signup requirements with safe-fallback getters.
    why: Zero-value never yields invalid regex or zero length.
  - name: DefaultSignupPolicy
    kind: func
    role: Returns the conservative default policy (email plus password required).
    why: Sensible starting point for apps that do not customise.
  - name: PolicyUsernameRequired
    kind: const
    role: Preset requiring username, email, and password.
    why: Common config for classic username-based apps.
  - name: PolicyEmailOnly
    kind: const
    role: Preset requiring only email and password.
    why: Username-less default for modern apps.
  - name: PolicyFlexible
    kind: const
    role: OAuth-friendly all-optional preset.
    why: Lets federated signups complete without any local credentials.
  - name: Credentials
    kind: struct
    role: Signup/login input.
    why: Email and Phone are pointers so absent is distinguishable from empty.
  - name: AuthError
    kind: struct
    role: Structured auth error with Code, Message, Field.
    why: Enables per-field form rendering and machine-readable codes.
  - name: AuthErrorHandler
    kind: type
    role: Pluggable error renderer returning true if it wrote the response.
    why: Lets apps redirect or render flash messages; false falls back to JSON.
  - name: SignupValidator
    kind: type
    role: Function-typed signup validator.
    why: Keeps validation in the app while core owns the flow.
  - name: CredentialsValidator
    kind: type
    role: Function-typed login validator returning the User.
    why: App owns password verification policy.
  - name: CreateUserFunc
    kind: type
    role: Function-typed user creator.
    why: App owns user provisioning specifics.
  - name: DefaultSignupValidator
    kind: const
    role: Sensible default signup validation (length, format, email/phone presence).
    why: Most apps can use it unmodified.
  - name: DetectUsernameType
    kind: func
    role: Heuristically classifies a login field as email, phone, or username.
    why: Lets one form field accept all three.
  - name: GetUserScopesFunc
    kind: type
    role: Callback that returns the allowed scopes for a user.
    why: Scope policy is app-defined (roles, groups, plan).
  - name: DefaultGetUserScopes
    kind: func
    role: Returns a default callback granting read/write/profile/offline to all users.
    why: Lets callers wire scope handling without writing one first.
  - name: ParseScopes
    kind: func
    role: Parses a space-separated scope string, deduplicated.
    why: Matches OAuth wire format.
  - name: JoinScopes
    kind: func
    role: Joins scopes back into a space-separated string.
    why: Round-trip helper for OAuth wire format.
  - name: IntersectScopes
    kind: func
    role: Returns scopes present in both slices (restrict).
    why: Filters requested scopes against the allowed set.
  - name: UnionScopes
    kind: func
    role: Returns sorted, deduplicated union of two scope slices (merge).
    why: Combines existing and newly-requested scope sets.
  - name: ContainsScope
    kind: func
    role: Membership check on a scope slice.
    why: Simple gate at handler boundaries.
  - name: ContainsAllScopes
    kind: func
    role: Reports whether all required scopes are present.
    why: Authorisation check for protected endpoints.
  - name: ValidateRequestedScopes
    kind: func
    role: Splits requested scopes into valid/invalid against an allowed set.
    why: Drives standards-compliant invalid_scope responses.
  - name: ScopesEqual
    kind: func
    role: Order-independent scope-slice equality.
    why: Comparison without normalising in callers.
  - name: TokenBlacklist
    kind: interface
    role: Tracks revoked JWT jti values until natural expiry.
    why: Pluggable so single-node uses memory and clusters use Redis with the same shape.
  - name: InMemoryBlacklist
    kind: struct
    role: Thread-safe in-memory TokenBlacklist with CleanupExpired sweeper.
    why: Bounded growth via self-expiring entries; fits single-process deployments.
  - name: RateLimiter
    kind: interface
    role: Per-key Allow() gate.
    why: Decouples rate policy from the limiter implementation.
  - name: InMemoryRateLimiter
    kind: struct
    role: Token-bucket RateLimiter with lazy refill and CleanupStale.
    why: Avoids a background ticker by refilling on each call.
  - name: AccountLockout
    kind: struct
    role: Per-key consecutive-failure counter that locks after MaxAttempts for LockDuration.
    why: Lockouts self-expire on read, so no sweeper is required.
  - name: SendEmail
    kind: interface
    role: App-provided email transport for verification and password-reset.
    why: Keeps SMTP/SES wiring out of core.
  - name: ConsoleEmailSender
    kind: struct
    role: Development SendEmail implementation that logs to stdout.
    why: Lets apps boot end-to-end without an SMTP backend.
  - name: GetUserIDFromContext
    kind: func
    role: Reads the logged-in user ID from request context.
    why: Uses a private key type to avoid cross-package context-key collisions.
  - name: SetUserIDInContext
    kind: func
    role: Stores the logged-in user ID in request context.
    why: Paired with GetUserIDFromContext for typed access.
  - name: DefaultUserParamName
    kind: const
    role: Default context key string ("loggedInUserId").
    why: Documented constant so middleware and handlers agree.
depends_on: []
