package: gae
purpose: Google Cloud Datastore-backed implementations of oneauth's account/identity/channel/token/key/username and app-registration stores, all sharing a single `namespace` + `NameKey(Kind, name, nil)` pattern.
language: go
last_rebuilt: 57a84270971b503a5e26dec841a214d21228c212
last_rebuilt_at: 2026-05-30T00:00:00Z
entities:
  - name: UserEntity
    kind: struct
    role: Datastore model for users (User kind) — IsActive flag, JSON profile blob (noindex), timestamps, version.
    why: Persistent shape decoupled from the public accounts.User interface so JSON profiles can be unindexed.
  - name: IdentityEntity
    kind: struct
    role: Datastore model for identities (Identity kind) — keyed by "type:value", indexed user_id for reverse lookups.
    why: Allows GetUserIdentities reverse-index queries while keeping the key human-readable.
  - name: ChannelEntity
    kind: struct
    role: Datastore model for auth channels (Channel kind) — keyed by "provider:identityKey", carries credentials/profile JSON.
    why: One row per (provider, identity) lets identity_key be queried for "all channels for this identity".
  - name: VerificationTokenEntity
    kind: struct
    role: Datastore model for localauth verification tokens (AuthToken kind) — token is the key name.
    why: Direct key lookup avoids any index; bulk delete is filterable by subject + type.
  - name: RefreshTokenEntity
    kind: struct
    role: Datastore model for refresh tokens (RefreshToken kind) — token-hash key, family/generation, JSON scopes + RFC 9396 authorization_details.
    why: Hash-keyed for O(1) lookup; family field indexed so a reuse attack can revoke the whole family.
  - name: APIKeyEntity
    kind: struct
    role: Datastore model for API keys (APIKey kind) — KeyID is the key, bcrypt KeyHash unindexed, HasExpiry flag.
    why: HasExpiry bool avoids omitempty pitfalls on time.Time zero-value when ExpiresAt is unset.
  - name: UsernameEntity
    kind: struct
    role: Datastore model for username→userID reservations (Username kind) — keyed by lowercased username, original case preserved in a field.
    why: Case-insensitive uniqueness via normalised key, but original casing is retained for display.
  - name: SigningKeyEntity
    kind: struct
    role: Datastore model for per-client signing keys (SigningKey kind) — clientID key, kid indexed for JWKS lookup.
    why: Two-way lookup (by clientID for signing, by kid for verification) on the same row.
  - name: KidKeyEntity
    kind: struct
    role: Datastore model for kid→key grace entries (KidKey kind) — kid is the key name, ExpiresAt unindexed.
    why: Grace store for verification during key rotation; CleanExpired scans in Go because Datastore can't combine "not zero" with "less than".
  - name: AppRegistrationEntity
    kind: struct
    role: Datastore model for DCR app registrations (AppRegistration kind) — client_id is the key name, every field noindex, CreatedAt stored as unix nanos.
    why: All fields noindex sidesteps Datastore's 1500-byte property index limit (which would reject long registration_client_uri values or large redirect_uris arrays); unix-nano CreatedAt avoids the microsecond truncation Datastore applies to time.Time properties so the conformance suite's equality check passes.
  - name: GAEUser
    kind: struct
    role: Concrete accounts.User implementation returned by UserStore — id, profile, active flag, timestamps.
    why: Plain DTO that's returned from CreateUser/GetUserById; SaveUser checks for this type to read back IsActive.
  - name: UserStore
    kind: struct
    role: accounts.UserStore implementation — CreateUser / GetUserById / SaveUser keyed by userId in the configured namespace.
    why: Maps the public store interface onto a single User kind.
  - name: IdentityStore
    kind: struct
    role: accounts.IdentityStore implementation — Get/Save identities, set UserID, mark verified, reverse-lookup by user_id.
    why: Transactions guard SetUserForIdentity and MarkIdentityVerified to keep Version monotonic.
  - name: ChannelStore
    kind: struct
    role: accounts.ChannelStore implementation — Get/Save channels and list channels for an identity key.
    why: Single Channel kind with composite "provider:identityKey" name plus indexed identity_key for fan-out.
  - name: TokenStore
    kind: struct
    role: core.TokenStore implementation for localauth verification tokens — CreateToken / GetToken (auto-deletes if expired) / DeleteToken / DeleteSubjectTokens.
    why: Keys-only filter + DeleteMulti gives a single batched purge for "all reset tokens for this subject".
  - name: RefreshTokenStore
    kind: struct
    role: core.RefreshTokenStore implementation — CreateRefreshToken / GetRefreshToken / RotateRefreshToken (transactional, reuse-detection) / RevokeRefreshToken / RevokeSubjectTokens / RevokeTokenFamily / GetSubjectTokens / CleanupExpiredTokens.
    why: Implements RFC 6749 §10.4 refresh-token rotation with family-wide revocation on reuse.
  - name: APIKeyStore
    kind: struct
    role: core.APIKeyStore implementation — CreateAPIKey (bcrypt hash, "oa_keyid_secret" format) / GetAPIKeyByID / ValidateAPIKey / RevokeAPIKey / ListSubjectAPIKeys / UpdateAPIKeyLastUsed.
    why: Tracks both KeyID (lookup) and a bcrypt hash of the secret (validation); HasExpiry flag avoids omitempty on time.Time.
  - name: UsernameStore
    kind: struct
    role: accounts.UsernameStore implementation — ReserveUsername / GetUserByUsername / ReleaseUsername / ChangeUsername with case-insensitive normalisation.
    why: ChangeUsername runs Get-then-Put in one transaction to prevent races between two users grabbing the same name.
  - name: GAEKeyStore
    kind: struct
    role: keys.KeyStorage implementation — PutKey / GetKey / GetKeyByKid / DeleteKey / ListKeyIDs over the SigningKey kind.
    why: One row per client lets either direction (clientID or kid) resolve a key via composite indexing.
  - name: GAEKidStore
    kind: struct
    role: keys.KidStorage implementation — Add / Remove (idempotent) / GetKeyByKid (honours ExpiresAt) / CleanExpired for the kid-grace store; GetKey deliberately returns ErrKeyNotFound.
    why: Verification-only grace cache for old kids during rotation; intentionally not a primary-key store.
  - name: GAEAppStore
    kind: struct
    role: core.AppRegistrationStore implementation — SaveApp / GetApp / ListApps / DeleteApp over the AppRegistration kind, completing the gae parity story with FS and GORM.
    why: New in this PR; shared Datastore client + namespace pattern means cmd/oneauth-server can switch backends by swapping a single dial and reusing the appstoretest conformance suite.
  - name: NewUserStore
    kind: func
    role: Constructor — returns a UserStore bound to a datastore client + namespace.
    why: Constructor-injection of the shared *datastore.Client keeps the store agnostic to dial/credentials wiring.
  - name: NewIdentityStore
    kind: func
    role: Constructor — returns an IdentityStore bound to a datastore client + namespace.
    why: Same shared-client pattern across every store in this package.
  - name: NewChannelStore
    kind: func
    role: Constructor — returns a ChannelStore bound to a datastore client + namespace.
    why: Same shared-client pattern across every store in this package.
  - name: NewTokenStore
    kind: func
    role: Constructor — returns a TokenStore bound to a datastore client + namespace.
    why: Same shared-client pattern across every store in this package.
  - name: NewRefreshTokenStore
    kind: func
    role: Constructor — returns a RefreshTokenStore bound to a datastore client + namespace.
    why: Same shared-client pattern across every store in this package.
  - name: NewAPIKeyStore
    kind: func
    role: Constructor — returns an APIKeyStore bound to a datastore client + namespace.
    why: Same shared-client pattern across every store in this package.
  - name: NewUsernameStore
    kind: func
    role: Constructor — returns a UsernameStore bound to a datastore client + namespace.
    why: Same shared-client pattern across every store in this package.
  - name: NewKeyStore
    kind: func
    role: Constructor — returns a GAEKeyStore bound to a datastore client + namespace.
    why: Same shared-client pattern across every store in this package.
  - name: NewKidStore
    kind: func
    role: Constructor — returns a GAEKidStore bound to a datastore client + namespace.
    why: Same shared-client pattern across every store in this package.
  - name: NewAppStore
    kind: func
    role: Constructor — returns a GAEAppStore bound to a datastore client + namespace.
    why: Same shared-client pattern; lets cmd/oneauth-server slot the gae app backend in with a one-line dial just like every other store here.
  - name: IdentityToEntity
    kind: func
    role: Converts a public accounts.Identity into an IdentityEntity bound to the supplied key.
    why: Per-row Datastore key cannot be derived from the value alone (it depends on namespace), so callers must pass the key in.
  - name: VerificationTokenToEntity
    kind: func
    role: Converts a localauth.VerificationToken into a VerificationTokenEntity bound to the supplied key.
    why: Same key-injection pattern as IdentityToEntity for namespace-aware writes.
  - name: IdentityEntity.ToIdentity
    kind: method
    role: Round-trips an IdentityEntity back into accounts.Identity (no key fields).
    why: Public store API hands out interface values, never entity structs.
  - name: VerificationTokenEntity.ToVerificationToken
    kind: method
    role: Round-trips a VerificationTokenEntity back into localauth.VerificationToken (token name carried as Key.Name).
    why: Public store API hands out interface values, never entity structs.
  - name: GAEUser.Id
    kind: method
    role: accounts.User implementation — returns the UserID.
    why: Implements the User interface as a plain struct (no DB round-trip on read).
  - name: GAEUser.Profile
    kind: method
    role: accounts.User implementation — returns the user profile map.
    why: Implements the User interface as a plain struct (no DB round-trip on read).
  - name: Kind constants
    kind: const
    role: KindUser / KindIdentity / KindChannel / KindAuthToken / KindRefreshToken / KindAPIKey / KindUsername / KindSigningKey / KindKidKey / KindAppRegistration.
    why: Single source of truth for Datastore kind names referenced from queries, keys, and tests.
