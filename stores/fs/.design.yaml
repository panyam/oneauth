package: fs
purpose: File-backed implementations of every oneauth store interface, optimized for dev and single-node deployments via file-per-record JSON layouts with atomic temp-file + rename writes.
language: go
last_rebuilt: 1fdddf397a0df7dcf0037de53891635664d8372f
last_rebuilt_at: 2026-05-27T20:17:38Z
entities:
  - name: safeName
    kind: function
    role: Sanitizes user-supplied input before use in path construction; rejects traversal, null bytes, and absolute paths.
    why: Single point of defense against CWE-22 across every FS store — every constructor that takes user input routes through this.
  - name: writeAtomicFile
    kind: function
    role: Writes data via temp file in the target directory, then os.Rename to final path with 0600 perms.
    why: Crash-safety primitive — guarantees readers see either the old contents or the new contents, never a partial file.
  - name: isExpired
    kind: function
    role: Helper returning false for zero time (never-expires sentinel).
    why: Centralizes the "zero = never" rule used in both lookup and cleanup.
  - name: FSUser
    kind: struct
    role: JSON-serializable user record implementing accounts.User (Id, Profile, timestamps).
    why: Decouples on-disk representation from the accounts.User interface so profile maps round-trip cleanly.
  - name: FSUserStore
    kind: struct
    role: Implements accounts.UserStore as one JSON file per user under users/.
    why: Simplest mapping; uses safeName so userId can be arbitrary string without traversal risk.
  - name: FSIdentityStore
    kind: struct
    role: Implements accounts.IdentityStore as one JSON file per (type, value) identity under identities/.
    why: Identity-as-file lets each provider login be looked up by a single OS read.
  - name: FSChannelStore
    kind: struct
    role: Implements accounts.ChannelStore as one JSON file per (provider, identityKey) under channels/.
    why: Channel credentials (OAuth tokens, etc.) isolated from primary identity records.
  - name: FSTokenStore
    kind: struct
    role: Implements localauth.VerificationTokenStore for email-verify / password-reset tokens under tokens/.
    why: Short-lived token storage with auto-cleanup on expired read.
  - name: FSRefreshTokenStore
    kind: struct
    role: Implements core.RefreshTokenStore as one JSON file per token (filename = sha256(token)) under refresh_tokens/; sync.RWMutex serializes intra-process access.
    why: Hashed filename means the raw token never appears in filesystem metadata, defending against directory-listing leaks.
  - name: FSAPIKeyStore
    kind: struct
    role: Implements core.APIKeyStore as one JSON file per keyID under api_keys/; bcrypt-hashes the secret; sync.RWMutex serializes intra-process access.
    why: Long-lived API keys need hash-at-rest separate from short-lived refresh tokens.
  - name: FSUsername
    kind: struct
    role: JSON record of a username reservation — stores normalized form + original case + UserID + Version.
    why: Case-insensitive lookup with case-preserving display.
  - name: FSUsernameStore
    kind: struct
    role: Implements accounts.UsernameStore as one JSON file per normalized-username under usernames/.
    why: Uniqueness enforced by filesystem — filename collision = username taken.
  - name: FSAppStore
    kind: struct
    role: Implements admin.AppRegistrationStore as one JSON file per client_id under apps/; sync.RWMutex serializes intra-process access.
    why: DCR-registered OAuth clients need first-class persistence; file-per-record avoids serializing the whole catalog on every write.
  - name: fsKeyEntry
    kind: struct
    role: On-disk JSON shape for a signing key — ClientID, raw key bytes, algorithm, optional kid.
    why: Decouples wire format from keys.KeyRecord (which has interface-typed Key).
  - name: FSKeyStore
    kind: struct
    role: Implements keys.KeyStorage as one JSON file per client_id under signing_keys/; sync.RWMutex serializes intra-process access.
    why: HMAC secrets and per-client signing keys; the by-kid lookup forces a directory scan since filenames are keyed by clientID.
  - name: fsKidEntry
    kind: struct
    role: On-disk JSON shape for a kid→key grace entry — adds an ExpiresAt (zero = never) over fsKeyEntry.
    why: Encodes the rotation grace window directly with the key bytes.
  - name: FSKidStore
    kind: struct
    role: Implements keys.KidStorage as one JSON file per kid under kid_keys/; sync.RWMutex serializes intra-process access.
    why: Retired keys with a TTL — lets tokens minted under the old kid keep validating during rotation.
